name: MurderMystery
version: '1.0.7'
main: com.murdermystery.MurderMysteryPlugin
api-version: '1.21'
description: 密室杀手：杀手持铁剑行凶，全体玩家用金锭商店购买一击必杀武器讨伐杀手
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

# 小游戏自动发现标记（扫描 plugins 目录 jar 的 plugin.yml）
minigame:
  name: 密室杀手
  icon: IRON_SWORD
  color: '8'

commands:
  murdermystery:
    description: 密室杀手小游戏
    usage: /mm help
    aliases: [mm, murder]

permissions:
  mm.use:
    description: 使用 /mm 加入对局
    default: true
  mm.admin:
    description: 管理密室杀手场地
    default: op
