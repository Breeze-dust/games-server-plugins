name: ArcadeParty
version: '1.3.7'
main: com.arcade.ArcadePartyPlugin
api-version: '1.21'
description: 街机派对：随机顺序串烧多个迷你小游戏
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds, DigToBottom, AnvilBattle, AnimalSlaughter, SnakeParty]

minigame-game: true
minigame:
  name: 街机派对
  icon: FIREWORK_ROCKET
  color: 'e'

commands:
  arcade:
    description: 街机派对
    usage: /arcade help
    aliases: [party, arcadeparty]

permissions:
  arcade.use:
    default: true
  arcade.admin:
    default: op
