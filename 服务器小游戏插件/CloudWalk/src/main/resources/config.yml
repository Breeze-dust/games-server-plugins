# ========== 云中漫步（主城跑酷）配置 ==========
# 区域和起点用游戏内命令设置：/cloudwalk pos1 / pos2 / setstart / setlobby
# 注意：插件关服时会回写本文件的 region/start/lobby 段；
# 手改配置请在停服后改，或改完执行 /cloudwalk reload。

# 跑酷生成区域：两个对角方块坐标（/cloudwalk pos1 / pos2）
region:
  world: ''
  x1: 0
  y1: 0
  z1: 0
  x2: 0
  y2: 0
  z2: 0

# 基准起点：玩家站的那一块方块（/cloudwalk setstart，取脚下那一块）
start:
  world: ''
  x: 0
  y: 0
  z: 0

# 回大厅位置（没装 HubCore 或主城没有配置时使用；/cloudwalk setlobby）
lobby:
  world: ''
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# 多人通道：每人一份区域副本，横向并排、逐层抬高
lane:
  axis: x        # x 或 z：通道并排的方向
  gap: 3         # 相邻通道之间的空格
  height-step: 2 # 每多一名玩家，起点抬高多少格
  max: 12        # 最多同时多少人跑

# 路径生成
path:
  distances: [3, 4]      # 每跳前进的水平格数
  queue-length: 3        # 前方预生成几个方块
  allow4-jump-up: false  # 原版跳不上「水平4格+上升1格」，默认关闭
  block: SMOOTH_STONE    # 方块材质

# 运行
run:
  afk-end-seconds: 10 # 这么久没得分就结束本局
  sound: true
  particle: true

top-size: 10
