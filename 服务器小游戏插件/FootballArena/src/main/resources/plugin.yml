name: FootballArena
version: '1.0.1'
main: com.football.FootballPlugin
api-version: '1.21'
description: 绿茵足球：红蓝两队踢球进球
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

# ===== 给主城插件（HubCore）的标记：自动登记为 tab 分区 / 菜单入口 =====
# name 必须与 HubCore config.yml games 段的 name 一致（display name）。
# 有这个段，GameRegistry 才记得住"插件名 FootballArena -> 显示名"，
# 公屏的"加入了游戏"播报（HubAPI.announceJoin(plugin.getName(), ...)）才不会显示成 [FootballArena]。
minigame-game: true
minigame:
  name: 绿茵足球
  icon: LEATHER_BOOTS
  color: a

commands:
  football:
    description: 绿茵足球小游戏
    usage: /fb help
    aliases: [fb, soccer]
permissions:
  fb.use:
    default: true
  fb.admin:
    default: op
