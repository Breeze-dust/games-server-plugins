name: DigToBottom
version: '1.0.3'
main: com.digdown.DigToBottomPlugin
api-version: '1.21'
description: 一掘到底：每人一根随机方块柱子，挖到基岩最快者获胜
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

# ===== 给主城插件（HubCore）的标记：自动登记到 tab / 播报 =====
minigame-game: true
minigame:
  name: 一掘到底
  icon: DIAMOND_PICKAXE
  color: '6'

commands:
  dig:
    description: 一掘到底小游戏
    usage: /dig help
    aliases: [dgb, digdown]
permissions:
  dig.use:
    default: true
  dig.admin:
    default: op
