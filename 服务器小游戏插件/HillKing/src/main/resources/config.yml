# ============================================================
# 高台之王（HillKing）配置文件
# 修改后在非对局状态执行 /hill reload，或重启服务器
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
# 最少开局人数（至少 2）
min-players: 2
# 最多人数
max-players: 16

# ---------- 对局 ----------
# 一局时长（秒）
game-seconds: 60
# 站在高台上每秒得多少分（离开高台不得分）
points-per-second: 1

# ---------- 咸鱼 ----------
fish:
  material: COD
  name: '&6&l咸鱼 &7(左键拍人)'
  lore:
  - '&7左键拍玩家，把 TA 从高台上拍下去'
  - '&7站在高台上每秒自动得分'
  # 击退等级：决定附魔显示与下面的默认力度（2 = 击退 II）
  knockback-level: 2
  # 每级的水平 / 垂直击退力度（默认 2 级 → 水平 1.2、垂直 0.5）
  horizontal-per-level: 0.6
  vertical-per-level: 0.25
  # 两次有效拍击之间的冷却（秒）
  cooldown-seconds: 0.3

# ---------- 等待室道具 ----------
wait-items:
  return:
    material: RED_BED
    name: '&a&l返回大厅 &7(右键)'
    lore:
    - '&7点击返回大厅'
    slot: 8
  start:
    material: PAPER
    name: '&a&l开始游戏 &7(右键)'
    lore:
    - '&7点击立刻开始本局'
    slot: 4

# ---------- 右侧计分板 ----------
sidebar:
  enabled: true
  # 标题（支持 & 颜色代码）
  title: '&6&l高台之王 · 积分'

# ---------- 场地 ----------
# 用指令设置，不要手写坐标；/hill build 会自动建台并生成出生点
arena:
  # 圆心（台面中心；/hill build 会自动写入）
  center: ''
  # 圆形半径（格）
  radius: 12
  # 台面比执行建场指令时站立的方块高几格（0 = 与脚下齐平）
  height: 3
  # 台面下方再铺几层石头（底座厚度）
  depth: 3
  # 台面方块 / 底座方块
  platform-material: RED_WOOL
  base-material: STONE
  # 等待点（/hill setlobby 写）
  lobby: ''
  # 玩家出生点（/hill build 会自动生成；也可 /hill genspawns 重新生成）
  spawns: []
