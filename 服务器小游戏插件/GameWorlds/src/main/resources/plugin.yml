name: GameWorlds
version: '1.0.0'
main: com.gameworlds.GameWorldsPlugin
api-version: '26.2'
description: 小游戏多世界：启动时自动创建/加载各游戏世界并按配置套用世界规则（禁刷怪、固定时间、PvP 按游戏）
# 不使用 load: STARTUP（Paper 26.2 禁止在 STARTUP 阶段创建世界）。
# 默认 POSTWORLD 阶段创建世界，四个游戏插件 softdepend: [GameWorlds] 保证本插件先加载，
# 这样游戏插件读取场地配置时（Bukkit.getWorld）世界一定已存在。

commands:
  gw:
    description: 多世界管理
    usage: /gw <list|tp|create|rules|reload>
    aliases: [gworlds, world]
    permission: gameworlds.admin

permissions:
  gameworlds.admin:
    description: 允许管理游戏世界
    default: op
