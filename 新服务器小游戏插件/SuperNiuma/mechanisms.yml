# ========== 超级牛马 机关列表 ==========
# 每个机关都可以在这里改：是否启用、权重、图标、说明、参数。
# 权重越大越容易被抽到；weight: 0 等于不出现。
# 尺寸规则：
#   平台 / 尖刺的 size 是 [x, z] 平面尺寸；
#   发射器的 size 是 [宽度, 高度]，深度固定 1 格，旋转后发射口始终朝外，不会被同机关的方块挡住。
# rotation 取值：
#   four-way        左键水平 90°，右键竖直 90°
#   six-way         左键水平 90°，右键竖直 90°（发射器朝向）
#   horizontal-flip 左键水平 90°，右键竖直 180°（尖刺）
#   vertical        只能竖直 180°

mechanisms:
  spike:
    enabled: true
    weight: 20
    icon: POINTED_DRIPSTONE
    name: '&c尖刺'
    lore:
      - '&7由滴水石构成'
      - '&7碰到尖刺的玩家本回合失败'
      - '&7左键水平旋转，右键上下翻转'
    rotation: horizontal-flip
    variants:
      single:
        name: '1x1'
        weight: 20
        size: [1, 1]
      row:
        name: '1x3'
        weight: 30
        size: [1, 3]
      medium:
        name: '2x3'
        weight: 30
        size: [2, 3]
      large:
        name: '3x3'
        weight: 20
        size: [3, 3]

  platform:
    enabled: true
    weight: 20
    icon: WHITE_WOOL
    name: '&f平台'
    lore:
      - '&7可以站立的羊毛平台'
      - '&7左键旋转，右键翻转'
    rotation: four-way
    variants:
      small:
        name: '&f小平台 1x2'
        weight: 50
        size: [1, 2]
      medium:
        name: '&f中平台 2x3'
        weight: 30
        size: [2, 3]
      large:
        name: '&f大平台 3x3'
        weight: 20
        size: [3, 3]

  dispenser:
    enabled: true
    weight: 15
    icon: DISPENSER
    name: '&7发射器'
    lore:
      - '&7按固定间隔发射箭矢'
      - '&7碰到箭的玩家本回合失败'
      - '&7多格发射器会一起发射'
    rotation: six-way
    interval-ticks: 40
    arrow-range: 20
    arrow-speed: 1.6
    variants:
      single:
        name: '1x1'
        weight: 30
        size: [1, 1]
      tall:
        name: '1x3'
        weight: 40
        size: [1, 3]
      wall:
        name: '2x3'
        weight: 30
        size: [2, 3]

  coin:
    enabled: true
    weight: 25
    icon: GOLD_BLOCK
    name: '&6金币'
    lore:
      - '&7没有碰撞箱的缩小金块'
      - '&7碰到后消失，回合结算加分'
      - '&7场上同时存在数量有上限'
    points: 0.5
    scale: 0.5
    max-on-field: 3         # 整局同时存在的金币上限；炸掉一个后才会再出现在选择里

  bomb:
    enabled: true
    weight: 10
    icon: TNT
    name: '&c炸弹'
    lore:
      - '&7炸掉范围内的所有机关'
      - '&7不会破坏地图原本的方块'
    radius: 1               # 1 = 3x3x3
    low-clear-rate: 0.05    # 本回合通关率低于该值时触发保底
    low-clear-weight: 40    # 触发保底时炸弹使用的权重
    low-clear-min-count: 1  # 保底至少出现几个炸弹

  spring:
    enabled: true
    weight: 10
    icon: IRON_BLOCK
    name: '&b弹簧方块'
    lore:
      - '&7站在上方会被弹起'
      - '&7保留当前水平速度'
      - '&7无法旋转'
    rotation: none
    height: 5.0             # 弹射高度（格）；预览玻璃柱向下取整
    variants:
      small:
        name: '1x1'
        weight: 60
        size: [1, 1]
      large:
        name: '2x2'
        weight: 40
        size: [2, 2]

  stairs:
    enabled: true
    weight: 12
    icon: OAK_STAIRS
    name: '&6楼梯方块'
    lore:
      - '&7摆放一条橡木楼梯'
      - '&7高度 3~6 格，宽度 1 格'
      - '&7左键水平旋转'
    rotation: horizontal-only
    variants:
      h3:
        name: '3格高'
        weight: 25
        size: [1, 3, 3]
      h4:
        name: '4格高'
        weight: 25
        size: [1, 4, 4]
      h5:
        name: '5格高'
        weight: 25
        size: [1, 5, 5]
      h6:
        name: '6格高'
        weight: 25
        size: [1, 6, 6]

  mine:
    enabled: true
    weight: 10
    icon: RED_CARPET
    name: '&c地雷'
    lore:
      - '&7踩到后 3x3x3 范围内玩家全部失败'
      - '&7需要放在方块上'
      - '&7无法旋转，触发后消失'
    rotation: none
    radius: 1

  ladder:
    enabled: true
    weight: 12
    icon: LADDER
    name: '&e梯子'
    lore:
      - '&7放置一条竖直梯子'
      - '&7需要贴在方块上'
      - '&7只能水平旋转'
    rotation: horizontal-only
    variants:
      short:
        name: '1x2'
        weight: 50
        size: [1, 2, 1]
      tall:
        name: '1x3'
        weight: 50
        size: [1, 3, 1]

  fragile:
    enabled: true
    weight: 12
    icon: CRACKED_STONE_BRICKS
    name: '&7易碎方块'
    lore:
      - '&7玩家经过上方后破碎'
      - '&7只在当前回合生效，下回合恢复'
    rotation: horizontal-only
    variants:
      v1x1:
        name: '1x1'
        weight: 20
        size: [1, 1]
      v1x2:
        name: '1x2'
        weight: 20
        size: [1, 2]
      v2x2:
        name: '2x2'
        weight: 20
        size: [2, 2]
      v2x3:
        name: '2x3'
        weight: 20
        size: [2, 3]
      v1x3:
        name: '1x3'
        weight: 20
        size: [1, 3]

  intermittent:
    enabled: true
    weight: 8
    icon: LODESTONE
    name: '&8间歇方块'
    lore:
      - '&7周期性出现和消失'
      - '&7间隔可在配置中调整'
      - '&7无法旋转'
    rotation: none
    interval-ticks: 60      # 出现/消失的切换间隔（tick）
    variants:
      v1x1:
        name: '1x1'
        weight: 25
        size: [1, 1]
      v1x2:
        name: '1x2'
        weight: 25
        size: [1, 2]
      v1x3:
        name: '1x3'
        weight: 25
        size: [1, 3]
      v2x2:
        name: '2x2'
        weight: 25
        size: [2, 2]

  ice:
    enabled: true
    weight: 12
    icon: ICE
    name: '&b冰平台'
    lore:
      - '&7会打滑的平台'
      - '&7可水平/竖直旋转'
    rotation: four-way
    variants:
      i1x2:
        name: '1x2'
        weight: 40
        size: [1, 2]
      i2x2:
        name: '2x2'
        weight: 30
        size: [2, 2]
      i3x3:
        name: '3x3'
        weight: 30
        size: [3, 3]

  piston:
    enabled: true
    weight: 10
    icon: PISTON
    name: '&7活塞'
    lore:
      - '&7把正前方的玩家沿朝向击飞'
      - '&7可以水平或垂直'
      - '&7击飞距离可配置'
    rotation: six-way
    distance: 5.0           # 击飞距离（格）

  portal:
    enabled: true
    weight: 6
    icon: ENDER_EYE
    name: '&5传送门'
    lore:
      - '&7先放第一个，再放第二个'
      - '&7第二个只能在第一个周围 7x7x7 内'
      - '&7蓝色玻璃表示出口朝向'
    rotation: horizontal-only
    range: 7                # 第二个传送门的可放置范围（奇数边长）

  blind:
    enabled: true
    weight: 8
    icon: BLACK_WOOL
    name: '&0致盲平台'
    lore:
      - '&7站上去会失明'
      - '&7离开后恢复'
    rotation: four-way
    variants:
      v1x1:
        name: '1x1'
        weight: 20
        size: [1, 1]
      v2x2:
        name: '2x2'
        weight: 20
        size: [2, 2]
      v3x3:
        name: '3x3'
        weight: 20
        size: [3, 3]
      v2x3:
        name: '2x3'
        weight: 20
        size: [2, 3]
      v1x3:
        name: '1x3'
        weight: 20
        size: [1, 3]

  speed:
    enabled: true
    weight: 8
    icon: BLUE_WOOL
    name: '&9加速带'
    lore:
      - '&7站上去获得速度提升'
      - '&7离开后保留加速惯性'
      - '&7落到普通地面后恢复'
    rotation: four-way
    amplifier: 1            # Speed 药水等级（0 = I 级）
    variants:
      v1x2:
        name: '1x2'
        weight: 25
        size: [1, 2]
      v1x3:
        name: '1x3'
        weight: 25
        size: [1, 3]
      v1x4:
        name: '1x4'
        weight: 25
        size: [1, 4]
      v1x5:
        name: '1x5'
        weight: 25
        size: [1, 5]

  traffic:
    enabled: true
    weight: 7
    icon: WHITE_WOOL
    name: '&f红绿灯'
    lore:
      - '&7绿 → 黄 → 红 循环'
      - '&7红灯时影响范围内禁止移动'
      - '&7绿/红持续时间为随机区间'
    rotation: horizontal-only
    yellow-seconds: 3       # 黄灯固定时长
    green-min-seconds: 3
    green-max-seconds: 8
    red-min-seconds: 3
    red-max-seconds: 8
    range-width: 7          # 影响区域宽（7x7 面的宽）
    range-depth: 3          # 影响区域向前长度
    range-height: 7         # 影响区域高
