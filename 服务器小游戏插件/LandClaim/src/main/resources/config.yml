# 等待人数
min-players: 2
# 最多 16 人（插件只有 16 种羊毛颜色）
max-players: 16
# 单局时长（秒）。0 = 不限时；时间到按占地格数结算
game-seconds: 300
# 扩展距离（曼哈顿距离）。1 = 只能占自己羊毛前后左右相邻的一格（不含斜角）
claim-radius: 1
# 场地地面方块
floor-block: GRASS_BLOCK
# 生成场地时，地面以上清空多少格
clear-height: 3

# 等待室道具（面板里可直接改材质/名字/描述）
wait-items:
  start:
    material: PAPER
    name: '&a&l开始游戏 &7(右键)'
    lore:
      - '&7点击立刻开始本局'
  leave:
    material: BARRIER
    name: '&c&l退出房间 &7(右键)'
    lore:
      - '&7点击离开等待室'

# 场地（OP 用 /land setcenter、/land setradius、/land generate 设置，再 /land save）
arena:
  world: world
  # 圆形场地中心（用 /land setcenter 设置）
  center: ''
  # 半径（格）
  radius: 0
  # 等待点（不设则使用第一个出生点）
  lobby: ''
  # 出生点列表（/land addspawn 或 /land genspawns 自动生成）
  spawns: []
