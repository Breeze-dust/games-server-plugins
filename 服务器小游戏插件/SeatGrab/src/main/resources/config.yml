# ============================================================
# 抢位占座（SeatGrab）配置文件
# 修改后在非对局状态执行 /seatgrab reload，或重启服务器
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
min-players: 2
# 最多 16 人（16 种书包颜色一一对应）
max-players: 16

# ---------- 对局 ----------
# 每回合抢座时间（秒）：到时间结算，期间可以互相偷书包、击退
round-seconds: 45
# 每回合结束后的准备时间（秒）
round-end-delay-seconds: 4
# 整局结束（最终积分公布后）停留多少秒再回大厅
end-delay-seconds: 5

# ---------- 固定回合 ----------
# 大一 ~ 大六，最多 6 回合（<= 6）
rounds:
  total: 4
  # 回合名（主标题用的就是这里；{name} 会替换成大一/大二等）
  names:
    - 大一
    - 大二
    - 大三
    - 大四
    - 大五
    - 大六
  # 每回合开始时的副标题，可以和上面一一对应（不足的回合用 messages.round-subtitle）
  subtitles:
    - '&f第一回合：把书包放进离讲台最近的展示框'
    - '&f第二回合：靠近讲台的座位分数更高'
    - '&f第三回合：可以用击退笔抢走别人的书包'
    - '&f第四回合：最后一回合，冲刺最高分'
    - '&f第五回合：加时赛，把书包放稳'
    - '&f第六回合：最终回合，别被击退'

# ---------- 排 / 座位 / 分数 ----------
# 从讲台向外按水平距离分段。每个展示框属于第一段满足 distance <= max-distance 的排；
# 超过最后一段的展示框都算最后一段（最后一段建议 max-distance 写 9999）。
# 每排每回合随机挑出 seats 个展示框作为可用座位，其余展示框放占位书包。
# score 是坐到这一排的座位上、回合结束时获得的分数。
score:
  rows:
    - max-distance: 6.0
      seats: 1
      score: 5
    - max-distance: 12.0
      seats: 3
      score: 3
    - max-distance: 9999.0
      seats: 5
      score: 1

# ---------- 击退笔 ----------
pen:
  # 击退笔命中后的水平击退力度
  knockback-horizontal: 1.05
  # 击退笔命中后的向上力度
  knockback-vertical: 0.42
  # 同一玩家两次命中的最小间隔（tick，20 = 1 秒）
  cooldown-ticks: 10

# ---------- 偷书包后的蓄力投掷 ----------
charge:
  # 按住右键多久达到最大力度（秒）
  max-seconds: 2.0
  # 最短 / 最长投掷速度
  min-speed: 0.6
  max-speed: 1.9
  # 投掷时的向上分量
  up: 0.25

# ---------- 场地 ----------
arena:
  world: world
  # 区域两个对角（只取 X/Z；pos1 的脚部 Y 记为地面高度）
  pos1: ''
  pos2: ''
  # 等待点 / 死亡后的旁观点（/seatgrab setlobby 写）
  lobby: ''
  # 讲台位置（/seatgrab setpodium 写）：讲台是一条沿 X 或 Z 轴的“正面线”，
  # 展示框按到这条线的垂直距离分排，不是按到讲台点的半径。
  podium: ''
  # 讲台线的排向：x = 排向沿 X 轴推进（讲台线沿 Z 轴）；z = 排向沿 Z 轴推进（讲台线沿 X 轴）。
  # /seatgrab setpodium 会按你的面朝方向自动判断，也可以用 /seatgrab setpodium x|z 强制指定。
  podium-axis: z
  # 回合出生点（/seatgrab addspawn 写，可多个；不写则在场地内随机找安全落脚点）
  spawns: []
  # 地面高度（玩家站立时的脚部 Y）；-999 = 未设置，自动用 pos1
  ground-y: -999
  # 自动向上延伸多少格来扫描展示框（从 pos1/pos2 较高的那个 Y 再往上）
  scan-height: 10

# ---------- 提示文字 ----------
# 每回合主标题：{name} = 大一/大二等
messages:
  round-title: '&6&l{name}'
  # 副标题列表缺项时的兜底
  round-subtitle: '&f把书包放进离讲台更近的展示框'
  round-end-title: '&e&l{name} 结束'
  round-end-subtitle: '&f本回合得分已结算，准备下一回合'

# ---------- 右侧计分板 ----------
sidebar:
  enabled: true
  title: '&e&l抢位占座'

# ---------- 等待室道具 ----------
wait-items:
  return:
    material: RED_BED
    name: '&a&l返回大厅 &7(右键)'
    lore:
      - '&7点击返回大厅'
    slot: 8
  start:
    material: PAPER
    name: '&a&l开始游戏 &7(右键)'
    lore:
      - '&7点击立刻开始本局'
    slot: 4
