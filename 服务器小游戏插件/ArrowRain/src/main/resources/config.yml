# ============================================================
# 万箭齐发（ArrowRain）配置文件
# 修改后在非对局状态执行 /arrowrain reload，或重启服务器
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
min-players: 2
max-players: 16

# ---------- 对局 ----------
# 一局时长（秒）；时间到仍存活的玩家并列获胜
game-seconds: 240
# 开局后多少秒进入第 1 回合
start-delay-seconds: 3
# 结算后等待多少秒回大厅
end-delay-seconds: 3

# ---------- 回合 ----------
round:
  # 每回合掩体刷新后，给玩家多少秒找掩体
  cover-seconds: 3
  # 每回合箭雨持续多少秒
  rain-seconds: 10
  # 箭雨结束到下一回合开始之间休息多少秒
  gap-seconds: 3
  # 第几回合开始允许玩家互相攻击（PvP 优先级高于天坑）
  pvp-start-round: 10

# ---------- 掩体（橡木半砖） ----------
covers:
  # 第 1 回合的掩体数量
  start-count: 8
  # 最少保留几个（不会低于这个数）
  min-count: 1
  # 每回合减少几个
  decrease-per-round: 1
  # 掩体方块
  material: OAK_SLAB
  # 掩体离地面（脚部 Y）多高；2 = 刚好在头顶上方，挡住上方落下的箭
  height: 2
  # 两个掩体之间的最小水平距离（格）
  min-distance: 3

# ---------- 箭雨 ----------
rain:
  # 箭从地面以上多少格落下
  arrow-height: 20
  # 每隔多少 tick 给每个没躲好的玩家头顶补一支箭（10 = 0.5 秒）
  target-interval-ticks: 10
  # 瞄准玩家时的水平随机偏移
  target-spread: 0.35
  # 下落速度（格/tick）
  arrow-speed: 1.2
  # 每秒钟额外在全场随机落多少支装饰箭
  ambient-per-second: 10

# ---------- 场地 ----------
arena:
  world: world
  # 区域两个对角（只取 X/Z）；pos1 的脚部 Y 会记录为地面高度
  pos1: ''
  pos2: ''
  # 等待点（/arrowrain setlobby 写）
  lobby: ''
  # 固定出生点（/arrowrain setspawn / addspawn 写）
  spawns: []
  # 地面高度（玩家站立时的脚部 Y）；-999 = 未设置，自动用 pos1 / 出生点
  ground-y: -999

# ---------- 右侧计分板 ----------
sidebar:
  enabled: true
  title: '&e&l万箭齐发 · 存活'

# ---------- 等待室道具 ----------
wait-items:
  return:
    material: RED_BED
    name: '&a&l返回大厅 &7(右键)'
    lore:
      - '&7点击返回大厅'
    slot: 8
  start:
    material: PAPER
    name: '&a&l开始游戏 &7(右键)'
    lore:
      - '&7点击立刻开始本局'
    slot: 4

# true = 每回合在控制台打印掩体数量/高度（排查用）
debug-rain: false
