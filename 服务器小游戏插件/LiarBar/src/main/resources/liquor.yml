# ========== 骗子酒馆的酒水配置 ==========
# 酒名 = 随机前缀 + "·" + 现实中的酒名，例如「冒泡的·伏特加」。
# 每次用 /liarbar give <玩家> [数量] 发放时随机生成一瓶（随机颜色）。

prefixes:
  - 陈年的
  - 冒泡的
  - 发霉的
  - 不明来历的
  - 烧喉的
  - 温热的
  - 廉价的
  - 珍藏的
  - 过期的
  - 神秘的
  - 烈性的
  - 苦涩的

names:
  - 伏特加
  - 威士忌
  - 朗姆酒
  - 龙舌兰
  - 白兰地
  - 金酒
  - 二锅头
  - 清酒
  - 梅酒
  - 黄酒
  - 苦艾酒
  - 朗姆可乐

# 玩家自助领酒指令 /liarbar liquor 的冷却（秒）；0 = 不限制
give-cooldown-seconds: 30

# 喝完后的反胃（Nausea）时长：在这个区间内随机（秒）
nausea:
  min-seconds: 4
  max-seconds: 12

# 空酒瓶投掷
throw:
  # 投掷初速度
  speed: 1.4
  # 砸中未入座玩家时的水平击退
  knockback-horizontal: 0.45
  # 砸中时的向上挑飞
  knockback-vertical: 0.2
  # 砸中时的伤害（只用于受击变红，按半颗心算）
  damage: 0.5
