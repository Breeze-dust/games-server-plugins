name: MemoryFlip
version: '1.1.4'
main: com.memoryflip.MemoryFlipPlugin
api-version: '1.21'
description: 记忆翻牌：翻开物品展示框配对，最快翻完获胜
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

minigame-game: true
minigame:
  name: 记忆翻牌
  icon: FILLED_MAP
  color: 'b'

commands:
  memory:
    description: 记忆翻牌小游戏
    usage: /memory help
    aliases: [mem, memoryflip, flip]

permissions:
  memory.use:
    default: true
  memory.admin:
    default: op
