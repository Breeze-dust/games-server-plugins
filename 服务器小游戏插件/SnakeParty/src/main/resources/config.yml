# ============================================================
# 蛇行派对（SnakeParty）配置文件
# 修改后在非对局状态执行 /snake reload，或重启服务器
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
# 最少开局人数（至少 2）
min-players: 2
# 最多人数
max-players: 16

# ---------- 对局 ----------
# 一局时长（秒）；时间到时仍存活的玩家共同获胜
game-seconds: 120
# 开始后先播几秒 title 倒计时（游戏即将开始：3/2/1），倒计时期间玩家不能动、也不会生成玻璃板
countdown-seconds: 3

# ---------- 自动前进 ----------
movement:
  # 每 tick 沿视线方向前进的基础速度（0.25 左右 ≈ 正常走路偏快；越大越快）
  speed: 0.28
  # 按住 W（前进键）且有体力时的加速倍率
  boost-multiplier: 1.7
  # 体力为 0 但仍按住 W 时的速度倍率（比完全松开 W 的人稍快一点）
  empty-w-multiplier: 1.15

# ---------- 体力 ----------
# 经验条就是体力条：按住 W 加速会消耗，松开 W 缓慢恢复；体力为 0 时不能加速
stamina:
  # 体力上限（经验条满格）
  max: 100
  # 加速时每秒消耗多少体力
  drain-per-second: 35
  # 不按 W 时每秒恢复多少体力
  regen-per-second: 18

# ---------- 玻璃板 ----------
plate:
  # 刚开局时每块玻璃板的存活时间（秒）
  lifetime-seconds: 3.0
  # 每过 1 秒，玻璃板存活时间增加多少毫秒（越大 = 消失得越慢）
  lifetime-growth-ms-per-second: 150
  # 玻璃板存活时间上限（秒）
  max-lifetime-seconds: 45.0
  # 玩家颜色顺序（自动拼成 <颜色>_STAINED_GLASS）
  colors:
    - RED
    - ORANGE
    - YELLOW
    - LIME
    - LIGHT_BLUE
    - BLUE
    - PURPLE
    - MAGENTA
    - PINK
    - CYAN
    - WHITE
    - GRAY
    - BROWN
    - GREEN
    - BLACK
    - LIGHT_GRAY

# ---------- 场地 ----------
# 用指令设置，不要手写坐标；设置完成后 /snake save
arena:
  # 场地中心（站在平台中央执行 /snake setarena <半径> 自动写入）
  center: ''
  # 方形场地的一半边长（格）；实际范围是 (2*半径+1) x (2*半径+1)
  radius: 16
  # /snake setarena 铺平台用的方块
  floor-material: STONE
  # 平台层数（1 = 一层；2 = 两层，都铺同一种方块）
  floor-layers: 2
  # 等待点
  lobby: ''
  # 玩家出生点，可多个；用 /snake addspawn 添加或 /snake genspawns 自动生成
  spawns: []

# 配置版本（旧配置迁移用，不要手改）
config-version: 1
