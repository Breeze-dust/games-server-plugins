# 玩家进出服务器时的聊天栏播报设置
# 颜色代码用 & 开头，例如 &a 绿色、&c 红色、&l 加粗
# 也支持十六进制颜色，例如 &#FFAA00
# 可用占位符: %player% = 玩家名, %online% = 当前在线人数
#           %title% = 玩家头衔（需要安装 PlayerTitles 插件，无头衔时自动省略）

join:
  # 玩家进入时是否播报
  enabled: true
  message: "&a[+] %title%%player% &7加入了服务器 &8| &7在线: &f%online%"

quit:
  # 玩家退出时是否播报
  enabled: true
  message: "&c[-] %title%%player% &7离开了服务器 &8| &7在线: &f%online%"
