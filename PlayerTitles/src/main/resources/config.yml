# 头衔菜单入口物品
menu-item:
  enabled: true
  # 物品材质（Bukkit 材质名）
  material: NETHER_STAR
  # 放在玩家背包的哪个槽位（0-35，0-8 为快捷栏）
  slot: 8
  # 进服后再次补发物品的延迟（tick），用于兼容会重置背包的插件；0 表示不补发
  retry-ticks: 40
  name: "&e头衔菜单 &7(点击打开)"
  lore:
    - "&7点击查看并选择你的头衔"
    - "&7该物品无法丢弃或移动"

# 头顶头衔
nametag:
  # 玩家回到这个主城世界后，会静默重刷一次头顶头衔
  # （小游戏可能占用主计分板队伍，离开游戏时会把头衔队伍顶掉）
  lobby-world: world

# 聊天设置
chat:
  # 玩家发言时是否在名字前显示头衔
  enabled: true
  # 玩家名与聊天内容之间的分隔符（原版聊天格式的尖括号会被移除）
  separator: ": "

# 头衔菜单标题
menu:
  title: "&8头衔菜单"
