# ========== 天坑插件配置（OP 用 /skypit 命令写入，也可手动编辑后 /skypit reload） ==========

# 战斗区域：玩家进入自动发放装备并开启 PvP（/skypit region pos1 / pos2 站在对角设置）
region:
  world: ''
  x1: 0
  y1: 0
  z1: 0
  x2: 0
  y2: 0
  z2: 0

# 天坑入口：/skypit warp 与主城中央菜单点击后传送位置（/skypit set entry）
entry:
  world: ''
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# 天坑内死亡后的复活点（/skypit set spawn；未设置则回主城）
spawn:
  world: ''
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# 战斗装备：进入天坑自动发放（/skypit kit 打开配置菜单，点击保存后写入此处）
# 与 DuelArena 相同的菜单方式：0-35 格为物品栏（0=主手），36 副手，37 头盔 38 胸甲 39 护腿 40 靴子
kit:
  slots: {}
  offhand: null
  helmet: null
  chestplate: null
  leggings: null
  boots: null

# 浮空文字排行榜（/skypit top 在脚下生成，top remove 移除；自动刷新前十名）
leaderboards: []
