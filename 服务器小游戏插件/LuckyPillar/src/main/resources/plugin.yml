name: LuckyPillar
version: '1.0.1'
main: com.luckypillar.LuckyPillarPlugin
api-version: '1.21'
description: 幸运之柱：柱阵、世界边境缩圈、随机幸运物品、箭雨/苦力怕雨/TNT 雨
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

# ===== 给主城插件（HubCore）的标记：自动登记为 tab 分区 / 菜单入口 =====
# name 必须与 HubCore config.yml games 段的 name 一致（显示名 幸运之柱）。
minigame-game: true
minigame:
  name: 幸运之柱
  icon: CRYING_OBSIDIAN
  color: '5'

commands:
  luckypillar:
    description: 幸运之柱小游戏
    usage: /lp help
    aliases: [lp, lpz, lucky]
permissions:
  lp.use:
    default: true
  lp.admin:
    default: op
