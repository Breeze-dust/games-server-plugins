name: HotPotato
version: '1.0.2'
main: com.hotpotato.HotPotatoPlugin
api-version: '1.21'
description: 烫手山芋：传 TNT、倒计时爆炸淘汰
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

# ===== 给主城插件（HubCore）的标记：自动登记为 tab 分区 / 菜单入口 =====
# name 必须与 HubCore config.yml games 段的 name 一致（display name）。
# 有这个段，GameRegistry 才记得住"插件名 HotPotato -> 显示名"，
# 公屏的"加入了游戏"播报（HubAPI.announceJoin(plugin.getName(), ...)）才不会显示成 [HotPotato]。
minigame-game: true
minigame:
  name: 烫手山芋
  icon: POTATO
  color: e

commands:
  hotpotato:
    description: 烫手山芋小游戏
    usage: /hp help
    aliases: [hp, potato]
permissions:
  hp.use:
    default: true
  hp.admin:
    default: op
