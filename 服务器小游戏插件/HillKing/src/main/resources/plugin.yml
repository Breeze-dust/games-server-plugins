name: HillKing
version: '1.0.2'
main: com.hillking.HillKingPlugin
api-version: '1.21'
description: 高台之王：站在红色羊毛高台上每秒得分，用咸鱼把对手拍下去
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

minigame-game: true
minigame:
  name: 高台之王
  icon: COD
  color: '6'

commands:
  hill:
    description: 高台之王小游戏
    usage: /hill help
    aliases: [king, koth, hillking]

permissions:
  hill.use:
    default: true
  hill.admin:
    default: op
