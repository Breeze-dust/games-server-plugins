# ============================================================
# TNT 对战（TNTBattle）配置文件
# 修改后：在非对局状态执行 /tntbattle reload，或重启服务器
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
# 最少开局人数（至少 2，双方各至少 1 人）
min-players: 2
# 最多人数，可自行调大（上限 100）
max-players: 16

# ---------- 调试 ----------
# true = 控制台输出每次爆炸的配置伤害/半径，以及每个参赛玩家受到的伤害事件
# （原因、基础伤害、最终伤害、是否被取消、当前血量）。排查伤害异常时打开，平时保持 false
debug-damage: false

# ---------- 背景音乐（红石音乐录制） ----------
# 用 /tntbattle music 把世界里的红石音乐录成音符序列，之后对局中任一方剩
# trigger-team-alive 人时开始循环，对局结束自动停止。
# 录制步骤：站在装置两个对角 music pos1 / music pos2 → music record → 启动红石机
#          → music stop（音符存 plugins/TNTBattle/music.yml）
music:
  enabled: true
  # 循环播放；false = 播完一遍就停
  loop: true
  # 默认是否给玩家开背景音乐；false = 常态关闭，等待室右键音符盒自己开启
  default-on: false
  # 音量（0.05-4.0）
  volume: 1.0
  # 任一方存活人数 <= 这个值时触发（默认 1 = 最后一人）
  trigger-team-alive: 1
  # 最后一个音符之后再等多少 tick 才循环（20 tick = 1 秒）
  tail-ticks: 20
  # 录制安全上限（秒），超过自动停止并保存，防止忘停
  max-record-seconds: 600

# ---------- 等待室道具 ----------
# 等待阶段发给玩家的道具，材质/名字/描述/槽位都能改
# slot：0-8 是快捷栏，8 = 最后一格
wait-items:
  # 所有等待玩家都会拿到：右键开关个人背景音乐（只影响自己，别人照常听）
  music:
    material: NOTE_BLOCK
    name: '&b&l背景音乐 &7(右键开关)'
    lore:
      - '&7只控制你自己能不能听到'
    slot: 0
  # 所有等待玩家都会拿到：右键返回主城
  return:
    material: CLOCK
    name: '&a&l回主城 &7(右键)'
    lore:
      - '&7点击返回主城'
    slot: 8
  # 仅管理员会拿到：右键立刻开始
  start:
    material: PAPER
    name: '&a&l开始游戏 &7(右键)'
    lore:
      - '&7点击立刻开始本局'
    slot: 4

# ---------- 内部配置版本 ----------
# 用于旧配置的一次性迁移，请不要手改
config-version: 7

# ---------- 普通 TNT ----------
# TNT 补给冷却（秒）：冷却结束自动获得 TNT 弹药
tnt-cooldown-seconds: 5
# 背包里最多持有多少 TNT 弹药（到达上限后不再补充）
tnt-max-ammo: 10
# 引信时间（tick，20 tick = 1 秒）
tnt-fuse-ticks: 40
# 发射初速度（1.5 ≈ 150%，数字越大飞得越远/越快）
tnt-velocity: 1.5
# 爆炸威力（原版 TNT 默认 4.0，越大破坏范围越大；掉落物固定为 0）
tnt-yield: 4.0
# TNT 爆炸对玩家造成的伤害（1 = 半颗心；0 = 不掉血）
tnt-damage: 10.0
# 爆炸伤害半径（格）：越靠近爆心伤害越高，边缘为 15%
tnt-damage-radius: 6.0
# 摔落伤害倍率（0 = 无摔落伤害，1 = 原版）
fall-damage-multiplier: 0.5

# ---------- 搭路蛋 ----------
# 跳起来丢搭路蛋时，桥会被压回脚下那层地面，避免铺在半空把落地的人卡成趴着
# ground-scan-depth：从脚下那一格往下最多找几格地面。找不到（虚空/高塔边缘）就按当前高度铺
# ground-min-gap：脚离地面至少高多少格才触发。越大越少触发，设成 100 等于关掉这个修正
bridge-egg:
  ground-scan-depth: 8
  ground-min-gap: 1.0

# ---------- TNT 数量随时间递增 ----------
# 每 interval-seconds 秒提升一档，每档多给 amount-per-step 个，最多 max-amount 个
# enabled: false 或 interval-seconds: 0 = 关闭（始终每次 1 个）
tnt-ramp:
  enabled: true
  interval-seconds: 60
  amount-per-step: 1
  max-amount: 5

# ---------- 特殊道具池 ----------
# 每 cooldown-seconds 秒随机获得一个特殊道具（与普通 TNT 补给互相独立）
# pool 按顺序列出所有特殊道具；weight 越大越容易随机到
# 想加同类型的变体，直接往下复制一个条目改属性即可
#
# type 支持的七种行为：
#   flame      烈焰弹：发射一颗原版火球，直线飞行、不拐弯也不下坠，碰到方块/实体才爆炸
#              （不发射 TNT、没有抛物线；yield / damage / damage-radius 是命中后的爆炸）
#   blackhole  黑洞炸弹：发射一只黑色羊，到点后把附近玩家吸向中心，不爆炸
#   decoy      诱饵炸弹：发射一只红色羊，到点后锁定附近玩家视角，不爆炸，到时消失
#   highex     高爆炸弹：发射一只闪电苦力怕（无 AI、不自行爆炸），到点后爆炸范围/伤害更大
#   sticky     粘性炸药：发射一个粘液块，撞到方块后黏住，到点爆炸
#   bridge_egg 搭路蛋：发射一个原版蛋，从玩家腿部高度起、沿蛋的抛物线向下铺自己队伍颜色的羊毛
#   angel      天使之赐：右键直接对自己施加漂浮效果，不发射任何东西
#
# 每项都有 enabled 开关：false = 这一项不再随机刷出（条目保留，随时打开）
#
# 通用字段：
#   enabled / type / weight / material / name / lore / velocity
#   velocity：发射速度（格/tick），越大飞得越快越远
#   fuse-ticks：发射后多少 tick 触发（highex 是引信，blackhole/decoy 是开始效果前的延迟；flame/搭路蛋不用）
#   yield：爆炸威力（flame / highex）
#   damage / damage-radius：爆炸伤害和伤害半径（flame / highex）
#   pull-radius / pull-strength / pull-seconds：吸附半径/每 tick 拉力/持续秒数（blackhole）
#   lock-radius / lock-seconds：锁定视角的半径/持续秒数（decoy）
#   max-blocks：一个搭路蛋最多铺多少格羊毛（bridge_egg）
#   width：桥的宽度（格，1-9；1 = 单格宽，3 = 三格宽）。宽度也计入 max-blocks（bridge_egg）
#   levitation-seconds / levitation-amplifier：漂浮持续秒数 / 等级（0 = 漂浮 I）（angel）
#   unlock-seconds：开局多少秒后才进入随机池（0 = 开局就有；默认黑洞 / 搭路蛋 120 秒）
special-items:
  # 特殊道具的独立获得冷却（秒）；0 = 不再自动发放特殊道具
  cooldown-seconds: 30
  pool:
    # 烈焰弹：发射后飞行，碰到方块或落地才爆炸
    #   self-launch：炸在自己 self-launch-radius 格以内时，给自己加的竖直初速度（0 = 关闭；1.0 约 6 格、0.8 约 4 格、1.2 约 8 格）
    #   self-launch-radius：判定"炸在自己脚边"的水平/直线距离
    - type: flame
      enabled: true
      weight: 25
      unlock-seconds: 0
      material: BLAZE_POWDER
      name: '&6&l烈焰弹 &7(右键发射)'
      lore:
        - '&7直线飞行，碰到方块或实体才爆炸'
      velocity: 1.2
      yield: 4.0
      damage: 10.0
      damage-radius: 6.0
      self-launch: 1.0
      self-launch-radius: 3.0

    # 黑洞炸弹：发射一只黑色羊，按 fuse-ticks 延迟后吸附附近玩家
    - type: blackhole
      enabled: true
      weight: 20
      unlock-seconds: 120
      material: NETHER_STAR
      name: '&5&l黑洞炸弹 &7(右键发射)'
      lore:
        - '&7落地后把附近玩家吸向中心'
      velocity: 1.0
      fuse-ticks: 20
      pull-radius: 8.0
      pull-strength: 0.35
      pull-seconds: 4

    # 诱饵炸弹：发射一只红色羊，按 fuse-ticks 延迟后锁定附近玩家视角
    - type: decoy
      enabled: true
      weight: 20
      unlock-seconds: 0
      material: TARGET
      name: '&e&l诱饵炸弹 &7(右键发射)'
      lore:
        - '&7让附近玩家的视线锁定它'
      velocity: 1.2
      fuse-ticks: 20
      lock-radius: 12.0
      lock-seconds: 5

    # 高爆炸弹：发射一只闪电苦力怕（关闭 AI，本体不会爆炸），到点后引爆
    - type: highex
      enabled: true
      weight: 20
      unlock-seconds: 0
      material: TNT
      name: '&c&l高爆炸弹 &7(右键发射)'
      lore:
        - '&7爆炸范围更大'
      velocity: 1.4
      fuse-ticks: 40
      yield: 8.0
      damage: 16.0
      damage-radius: 10.0

    # 粘性炸药：发射一个粘液块，撞到方块后黏住，到点爆炸
    - type: sticky
      enabled: true
      weight: 18
      unlock-seconds: 0
      material: SLIME_BLOCK
      name: '&a&l粘性炸药 &7(右键发射)'
      lore:
        - '&7飞出去后黏在方块上，到点爆炸'
      velocity: 1.3
      fuse-ticks: 40
      yield: 6.0
      damage: 12.0
      damage-radius: 8.0

    # 搭路蛋：发射一个原版蛋，轨迹上铺自己队伍颜色的羊毛
    - type: bridge_egg
      enabled: true
      weight: 20
      unlock-seconds: 120
      material: EGG
      name: '&f&l搭路蛋 &7(右键发射)'
      lore:
        - '&7沿蛋的飞行轨迹铺出羊毛路'
      velocity: 1.2
      max-blocks: 30
      width: 1

    # 天使之赐：右键直接获得漂浮效果
    - type: angel
      enabled: true
      weight: 15
      unlock-seconds: 0
      material: FEATHER
      name: '&b&l天使之赐 &7(右键使用)'
      lore:
        - '&7获得漂浮效果'
      levitation-seconds: 6
      levitation-amplifier: 0

# ---------- 牛排 ----------
# 开局放在快捷栏指定格；默认不会自动补充
steak:
  enabled: true
  # 每次给多少个（最大 64）
  amount: 64
  # 放在快捷栏第几格（0-8；8 = 最后一格）
  slot: 8
  # 是否自动补充（false = 吃完就没有）
  auto-refill: false
  # 自动补充间隔（秒）
  refill-cooldown-seconds: 30

# ---------- 羊毛 ----------
# 每隔多少秒获得一次羊毛
wool-cooldown-seconds: 1
# 每次获得多少个
wool-amount: 1

# ---------- 淘汰 / 建造限制 ----------
# 掉到这个 Y 以下直接淘汰
void-y: -64
# 建筑高度上限（绝对 Y）：只能在这层及以下放羊毛；-1 = 不限制
build-height-limit: -1

# ---------- 大厅胜场排行榜（悬浮文字） ----------
# 用 /tntbattle settop 放在当前位置、/tntbattle removetop 移除；不要手写坐标
leaderboard:
  enabled: true
  # 显示前几名（0 = 全部）
  limit: 10
  # 标题 / 每行格式 / 无记录时的提示；可用占位符 %rank% %player% %wins%
  title: '&6&lTNT 对战 胜场排行榜'
  line: '&e#%rank% &f%player% &7- &c%wins% &7胜'
  empty: '&7暂无胜场记录'
  # 可见距离（1.0 = 约 64 格；调大后远处也能看到）
  view-range: 4.0
  location: ''

# ---------- 场地 ----------
# 用指令设置，不要手写坐标；设置完成后 /tntbattle save
arena:
  world: world
  # 区域两个对角（只取 X/Z，Y 自动覆盖整个世界高度）
  # TNT 只会破坏这个范围内的方块，范围外不会影响其他小游戏场地
  pos1: ''
  pos2: ''
  # 等待点
  lobby: ''
  # 每队出生点，可多个；用 /tntbattle addspawn red|blue 添加
  red-spawns: []
  blue-spawns: []
