# ============================================================
# 动物屠宰（AnimalSlaughter）配置文件
# 修改后在非对局状态执行 /animal reload，或重启服务器
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
# 最少开局人数（至少 2）
min-players: 2
# 最多人数
max-players: 12

# ---------- 对局 ----------
# 一局时长（秒）
game-seconds: 60
# 开始后先倒计时几秒才放动物/开始计时（标题显示「游戏即将开始：3/2/1」）
countdown-seconds: 3

# ---------- 动物 ----------
mobs:
  # 每隔多少 tick 检查并补充一次动物（20 tick = 1 秒）
  spawn-interval-ticks: 20
  # 每次检查最多补几只
  spawn-per-cycle: 2
  # 正常动物上限（达到上限就不再生成）
  limits:
    chicken: 10
    pig: 6
    cow: 3
  # 干扰项上限（独立计算；三种各一个上限）
  decoy-limits:
    chicken: 2
    pig: 1
    cow: 1
  # 正常动物的血量（干扰项固定 1 血）
  health:
    chicken: 1.0
    pig: 2.0
    cow: 4.0
  # 击杀得分
  score:
    chicken: 1
    pig: 3
    cow: 5
  # 干扰项击杀扣当前分数的百分比（扣到 0 为止）
  decoy-percent: 50
  # 动物受伤后的无敌帧（tick）；0 = 没有无敌帧，连续攻击每一下都生效
  invulnerable-ticks: 0

# ---------- 逃跑 ----------
flee:
  # 被攻击后乱走时，每次换方向/换目标点的寻路速度倍率（1.0 = 正常走路）
  speed: 1.5
  # 牛的速度倍率（更快的牛）
  cow-speed: 2.4
  # 每次被打后乱走持续多少毫秒
  duration-ms: 1200
  # 乱走的范围：以被攻击点为圆心，最多跑这么远（格）
  wander-radius: 4.0
  # 乱走时多久换一个目标点（毫秒）
  repath-ms: 400

# ---------- 右侧计分板 ----------
sidebar:
  enabled: true
  # 计分板标题（支持 & 颜色代码；可用占位符 {time} 剩余秒数、{phase} 剩余/准备）
  title: '&c&l动物屠宰 · 积分'
  # 顶部固定行；右侧数字就是 header-score
  header: '&7积分榜'
  # 顶部行右侧的数字；设为 0 = 不显示这一行（只有玩家分数）
  header-score: 0
  # 每名玩家一行，可用占位符：{name} 名字、{score} 分数、{kills} 击杀数
  line: '&e{name}'
  # 底部动态行；可用占位符 {time} 剩余秒数、{phase} 剩余/准备
  footer: '&7{phase} &e{time}s'
  # 底部行右侧的数字；设为 0 = 不显示这一行
  footer-score: 0

# ---------- 掉落物 ----------
drops:
  # 掉落物不可拾取，多少秒后自动清理
  clear-seconds: 8

# ---------- 场地 ----------
# 用指令设置，不要手写坐标；设置完成后 /animal save
arena:
  # 圆心（站在场地中心执行 /animal setarena <半径> 会自动写入）
  center: ''
  # 圆形半径（格）
  radius: 16
  # 等待点
  lobby: ''
  # 玩家出生点，可多个；用 /animal addspawn 添加或 /animal genspawns 自动生成
  spawns: []
