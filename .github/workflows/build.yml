name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build BuildBattle plugins
        working-directory: 服务器小游戏插件
        run: |
          set -euo pipefail
          mvn -B -q --no-transfer-progress -f MiniGameLib/pom.xml install -DskipTests
          for pom in */pom.xml; do
            case "$pom" in
              MiniGameLib/pom.xml) continue ;;
            esac
            echo "== $pom"
            mvn -B -q --no-transfer-progress -f "$pom" package -DskipTests
          done

      - name: Build PlayerTitles
        working-directory: PlayerTitles
        run: mvn -B -q --no-transfer-progress install -DskipTests

      - name: Build JoinQuitBroadcast
        working-directory: JoinQuitBroadcast
        run: mvn -B -q --no-transfer-progress package -DskipTests
