# ========== 箭术大师（主城限时射箭）配置 ==========
# 靶场区域用编辑模式设置：
#   /archery edit                  进入编辑模式
#                                   木棍：左键/右键选两个对角
#                                   下界之星：确认区域，然后在聊天栏输入基础得分
#                                   绿宝石：保存场地
#                                   屏障：退出编辑模式（未保存的修改丢弃）
#   /archery regions               查看已保存的区域
#   /archery region remove <序号>  删除某个区域
# 命令会写回 regions / start / leaderboards 段；手改请在停服后改，或改完 /archery reload。

# 射击站位（可选）：站到射击位执行 /archery setstart。
# 配置后玩家开局会被传送到这里；不配置时玩家就在执行 /archery 的位置开玩，
# 两种情况结束时都会回到进入前的位置和视角。
start:
  world: ''
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

game:
  time-seconds: 60        # 每局时长（秒）

# 靶子
targets:
  max: 8                  # 场上同时存在的靶子数
  respawn-delay-ticks: 10 # 射中后隔多久补一个新靶（20 刻 = 1 秒）
  lifetime-seconds: 0     # 靶子最多存在多久；0 = 不自动消失
  small-chance: 0.35      # 缩小靶概率（0~1）
  moving-chance: 0.50     # 移动靶概率（0~1），未抽中就是固定靶
  min-speed: 1.5          # 移动靶速度下限（格/秒）
  max-speed: 6.0          # 移动靶速度上限（格/秒），每只靶随机取区间内速度
  fast-speed: 4.5         # 速度 >= 这个值算「快速移动靶」（格/秒）
  small-scale: 0.5        # 缩小靶的边长（正常靶是 1.0）
  small-glow-color: '#FF0000' # 缩小靶的发光颜色（#RRGGBB 或 RED/YELLOW/AQUA...）

  # 三种靶子的方块（写 Bukkit 方块材质名；缩小靶按 small-scale 缩放）
  blocks:
    fixed: TARGET         # 固定靶
    moving: REDSTONE_BLOCK # 移动靶
    fast: GOLD_BLOCK      # 快速移动靶

  # 得分 = 区域基础分 + 以下三项独立加成（可叠加，互不影响）
  bonuses:
    moving: 1             # 移动靶额外 +1
    fast: 2               # 快速移动靶额外 +2
    small: 2              # 缩小靶额外 +2

effects:
  sound: true
  particle: true

top-size: 10              # 排行榜显示前几名

# 靶场区域：/archery edit 写入。每项是一个长方体，基础分在确认区域时输入。
regions: []

# 浮空文字排行榜（/archery top place 在当前位置放置，top remove 移除）
leaderboards: []
