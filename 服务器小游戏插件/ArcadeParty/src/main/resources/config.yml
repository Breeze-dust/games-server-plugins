# ============================================================
# 街机派对（ArcadeParty）配置文件
# 修改后在非对局状态执行 /arcade reload，或重启服务器
# 也可以管理员用 /arcade menu 打开菜单，在游戏里直接调
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
# 最少开局人数（至少 2）
min-players: 2
# 每局派对最多多少名玩家（超出部分不能加入派对）
max-players: 16

# ---------- 派对流程 ----------
# 每局派对串烧几个小游戏（最多不超过启用的小游戏数量）
games-per-party: 3
# 两个小游戏之间的准备阶段（秒）
transition-seconds: 15
# 过渡阶段：会先把参赛者加入下一个游戏的等待区（lobby）再倒计时
transition:
  # 过渡阶段是否锁住移动（仍可转头）
  freeze: true
# 单个小游戏最长等多久（秒）：超时按“无人得分”进入下一局，防止卡死
round-timeout-seconds: 600

# ---------- 星星 ----------
stars:
  first: 3
  second: 2
  third: 1
  # 因为人数超过小游戏上限而当轮旁观的人，补偿多少颗星
  spectator-bonus: 1

# ---------- 场地 ----------
# 派对的等待区（聚会开始前后都在这里集合）
lobby: ''
# 颁奖台区域：观众站位 + 第 1/2/3 名的站位
podium:
  audience: ''
  first: ''
  second: ''
  third: ''

# ---------- 颁奖烟花 ----------
fireworks:
  enabled: true
  # 每次放几颗
  count: 3
  # 每颗之间隔多少 tick
  interval-ticks: 10
  # 升空多少 tick 后爆炸（20 tick = 1 秒）
  flight-ticks: 30
  # 烟花类型（BALL / BALL_LARGE / STAR / CREEPER / BURST）
  types:
    - BALL
    - BALL_LARGE
    - STAR
    - CREEPER
    - BURST

# ---------- 右侧计分板（准备阶段的星星榜） ----------
scoreboard:
  enabled: true
  title: '&e&l街机派对 · 星星'
  line: '&e{name}'

# ---------- 小游戏池 ----------
# key = 游戏标识（游戏里 ArcadeBridge.report 用的 key）
# join-command / start-command：派对用它把玩家拉进小游戏并开局（不要带前导 /）
# max-players：这局小游戏最多坐几个人，超出的当轮旁观并拿补偿星
games:
  # arena-aware: true = 多场地游戏，命令里的 {arena} 会被替换成当前空场名；
  #                没有空场时这个游戏不会排进本局派对
  digtobottom:
    display: 一掘到底
    enabled: true
    arena-aware: true
    max-players: 8
    join-command: 'dig join {arena}'
    start-command: 'dig start {arena}'
  anvilbattle:
    display: 铁砧掘战
    enabled: true
    arena-aware: false
    max-players: 12
    join-command: 'anvil join'
    start-command: 'anvil start'
  animalslaughter:
    display: 动物屠宰
    enabled: true
    arena-aware: false
    max-players: 12
    join-command: 'animal join'
    start-command: 'animal start'
  snakeparty:
    display: 蛇行派对
    enabled: true
    arena-aware: false
    max-players: 16
    join-command: 'snake join'
    start-command: 'snake start'

  hotpotato:
    display: 烫手山芋
    enabled: true
    arena-aware: true
    max-players: 12
    join-command: 'hotpotato join {arena}'
    start-command: 'hotpotato start {arena}'
  tntrun:
    display: 雪塔大作战
    enabled: true
    arena-aware: true
    max-players: 12
    join-command: 'tntrun join {arena}'
    start-command: 'tntrun start {arena}'
  colorparty:
    display: 色盲派对
    enabled: true
    arena-aware: true
    max-players: 12
    join-command: 'colorparty join {arena}'
    start-command: 'colorparty start {arena}'
  grouprace:
    display: 群友竞速
    enabled: true
    arena-aware: false
    max-players: 16
    join-command: 'race join'
    start-command: 'race start'
  knockback:
    display: 击退大战
    enabled: true
    arena-aware: false
    max-players: 16
    join-command: 'knockback join'
    start-command: 'knockback start'
  landclaim:
    display: 占地风云1
    enabled: true
    arena-aware: false
    max-players: 16
    join-command: 'land join'
    start-command: 'land start'
  jumpfill:
    display: 花落水家
    enabled: true
    arena-aware: false
    max-players: 16
    join-command: 'jump join'
    start-command: 'jump start'

  memoryflip:
    display: 记忆翻牌
    enabled: true
    arena-aware: false
    max-players: 16
    join-command: 'memory join'
    start-command: 'memory start'

  hillking:
    display: 高台之王
    enabled: true
    arena-aware: false
    max-players: 16
    join-command: 'hill join'
    start-command: 'hill start'

# 配置版本（迁移用，不要手改）
config-version: 1
