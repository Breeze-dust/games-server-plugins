name: TNTBattle
version: '1.12.1'
main: com.tntbattle.TNTBattlePlugin
api-version: '26.2'
description: TNT 对战：两队隔岛互射 TNT，搭羊毛桥，团灭对手获胜
author: example

depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

commands:
  tntbattle:
    description: TNT 对战
    usage: /tntbattle help
    aliases: [tb]

permissions:
  tntbattle.play:
    description: 允许加入 TNT 对战
    default: true
  tntbattle.admin:
    description: 允许配置和管理 TNT 对战
    default: op

# ===== 给 HubCore 的小游戏标记 =====
minigame-game: true
minigame:
  name: TNT 对战
  icon: TNT
  color: 'c'
