# ============================================================
# 铁砧掘战（AnvilBattle）配置文件
# 修改后在非对局状态执行 /anvil reload，或重启服务器
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
# 最少开局人数（至少 2）
min-players: 2
# 最多人数
max-players: 12

# ---------- 对局 ----------
# 一局时长（秒）；时间到时仍存活的玩家共同获胜
game-seconds: 180

# ---------- 铁砧 ----------
anvil:
  # 每隔多少秒落一波铁砧
  interval-seconds: 1
  # 每波初始落几个铁砧
  amount: 3
  # 随时间增加每波数量：enabled=false 关闭；每 interval-seconds 秒多 amount-per-step 个，封顶 max-amount
  ramp:
    enabled: true
    interval-seconds: 30
    amount-per-step: 1
    max-amount: 12
  # 砸掉方块后继续往下钻多少秒再消失（0 = 砸完立刻消失）
  fall-after-break-seconds: 2
  # 在柱子最上方方块的头顶多少格生成
  spawn-height: 12
  # 落地破坏范围：0 = 只砸落点下方 1 格；1 = 3×3
  break-radius: 0
  # 从落点往下破坏几层：0 = 只砸 1 格；2 = 落点那层 + 下面 2 层
  break-depth: 0

  # 玩家头顶定向落砧：每一波先按概率把铁砧直接砸到某个玩家的头顶。
  # 这次没在他头顶落砧 -> 下一次概率 +chance-step（可叠加）；落成后重置为 base-chance。
  # 本波名额有限，被随机落砧占满时其余玩家这波不参与。
  player-target:
    enabled: true
    base-chance: 0.15
    chance-step: 0.10
    max-chance: 0.75

# ---------- 场地 ----------
# 用指令设置，不要手写坐标；设置完成后 /anvil save
arena:
  # 场地范围两个对角（X/Y/Z 都取）
  pos1: ''
  pos2: ''
  # 等待点
  lobby: ''
  # 玩家出生点，可多个；用 /anvil addspawn 添加
  spawns: []
  # 掉到这个高度以下淘汰
  void-y: -64.0
  # 铁砧开始下落的绝对 Y；0 = 自动（柱顶 + anvil.spawn-height）
  anvil-y: 0.0

# 配置版本（旧配置迁移用，不要手改）
config-version: 1
