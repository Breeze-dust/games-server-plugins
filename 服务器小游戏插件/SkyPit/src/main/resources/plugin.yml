name: SkyPit
version: '1.0.2'
main: com.skypit.SkyPitPlugin
api-version: '1.21'
description: 天坑插件：OP 配置战斗区域，玩家进入自动发放装备并开启 PvP，记录击杀数，浮空文字展示前十名
depend: [MiniGameLib, HubCore]
commands:
  skypit:
    description: 天坑战斗区域
    usage: /skypit help
    aliases: [pit, 天坑]
    permission: skypit.use
permissions:
  skypit.use:
    description: 使用天坑（加入战斗、查看击杀）
    default: true
  skypit.admin:
    description: 管理天坑（配置区域、装备、排行榜）
    default: op

# ===== 给主城插件的标记（tab 分区显示"天坑"）=====
minigame-game: true
minigame:
  name: 天坑
  icon: IRON_SWORD
  color: '6'
