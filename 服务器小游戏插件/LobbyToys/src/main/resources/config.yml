# ========== 主城小玩具（LobbyToys）配置 ==========

# 允许使用玩具的世界名（主城）。不在列表里的世界右键道具只提示、不生效。
worlds:
  - world

# 进入上述世界时自动发一个玩具道具
give-on-join: true
# 玩具道具优先放的快捷栏槽位（0-8），被占则自动找空位
item-slot: 8

# 分身自转速度（度/刻，20 刻 = 1 秒；4.0 = 每 4.5 秒转一圈）
spin-degrees-per-tick: 4.0

# 弹跳：模型整体缩放的最大幅度（0.15 = 最扁时缩到 85%）与周期（刻）
# 说明：原版客户端对玩家模型只支持等比缩放，做不到"垂直压扁的同时变宽"；
#       0 = 关闭弹跳（模型保持原大小，只自转）。
squash-amount: 0.15
squash-period-ticks: 40

# 缩小药水把玩家缩到原来的多少（0.2 - 1.0），模型和碰撞箱会一起缩小
shrink-scale: 0.5

# 右键开关的冷却（毫秒）
cooldown-millis: 1500

# 是否对召唤者本人隐藏分身。
# false = 第三人称（F5）也能看到自己的分身跟着自己转；
# true  = 只有其他玩家看得到（第一人称不会被模型挡住，但 F5 看不到自己）。
hide-from-owner: false

# ========== 小玩具外观 ==========
# 名字、代表道具、描述都可以在这里改；支持 & 颜色代码。
# material 用 Bukkit 材质名（如 PLAYER_HEAD、SLIME_BALL、FIREWORK_ROCKET）；
# 写错或留空会回退到默认值，并在控制台打警告，不会导致加载失败。
# 水瓶不是 WATER_BOTTLE：要写 material: POTION + potion: WATER。
# potion 可选，只对 POTION / SPLASH_POTION / LINGERING_POTION 生效（如 WATER、STRENGTH）。
# 键名 clone 是玩具 id，不要改。
toys:
  clone:
    name: "&b分身玩具"
    material: PLAYER_HEAD
    # potion: WATER
    lore:
      - "&7右键 召唤 / 收回 你的分身"
      - "&8只能在主城使用"
  shrink:
    name: "&d缩小药水"
    material: POTION
    potion: THICK
    lore:
      - "&7右键 缩小 / 恢复自己的身形"
      - "&8只能在主城使用"

# ========== 刮刮乐 ==========
# 只通过 /lobbytoys scratch 打开（权限 lobbytoys.scratch，默认 op），
# 暂时不放进「小玩具」菜单，所以普通玩家看不到入口。
# 玩法：玩家面前生成一个固定 item frame，里面是一张 128x128 的地图；
#       按住左键在卡面上刮，刮开一格就按该格的奖品发物品 / 触发事件。
scratch:
  enabled: true
  # 奖品格子的行数、列数（1-6）。命令可用 /lobbytoys scratch <行> <列> 临时覆盖。
  rows: 3
  columns: 3
  # 刮除笔刷半径（地图像素，1-16）。越大越好刮；3x3 的卡建议 5-7。
  brush-radius: 6
  # 一格被刮掉多少比例算揭开（0.2-1.0）。越小越容易揭开。
  reveal-threshold: 0.55
  # 单张卡最长存在时间（秒），到点自动收回
  session-seconds: 90
  # 屏幕离玩家眼睛的距离（格）；面前没空间会自动靠近
  screen-distance: 2.5
  # 玩家离开屏幕多远自动收回（格）
  max-distance: 6.0
  # 同时存在的刮刮乐上限（也是地图 id 池上限，避免地图文件无限增长）
  max-sessions: 4

  # true  = 只有点开刮刮乐的人能看到卡面（其他玩家被隐藏，适合主城）；
  # false = 附近所有玩家都能看到这张卡面（适合活动/围观）。
  hide-from-others: true

  # 奖品表：每一格独立按 weight 抽一个。
  # blank: true = 谢谢惠顾（不发物品）。
  # material/amount = 实际发放的物品；amount 上限 64。
  # color  = 卡面上这一格的颜色（#RRGGBB）；label = 刮开后在卡面上显示的 ASCII 文字（地图字体不支持中文）。
  # image  = 可选，plugins/LobbyToys/scratch-images/ 下的 PNG 文件名，会缩放画在格子里。
  # sound  = 可选，Bukkit 音效名（如 ENTITY_PLAYER_LEVELUP）。
  # message = 可选，刮开时发给玩家的消息。
  # commands = 可选，控制台命令列表，支持 %player% / %uuid% / %prize% 占位符。
  #            这就是「事件效果」的接入点：give、effect、lp、其他插件命令都能挂在这里。
  # 另外每次揭开都会触发自定义事件 ScratchCardPrizeEvent，其他插件可直接监听。
  prizes:
    blank:
      name: "&8谢谢惠顾"
      blank: true
      weight: 55
      color: "#3A3A3A"
      label: "SORRY"
    diamond:
      name: "&b钻石"
      material: DIAMOND
      amount: 1
      weight: 8
      color: "#4AEDD9"
      label: "DIAMOND"
      sound: ENTITY_PLAYER_LEVELUP
      message: "&b你刮到了一颗钻石！"
    emerald:
      name: "&a绿宝石"
      material: EMERALD
      amount: 1
      weight: 10
      color: "#41F384"
      label: "EMERALD"
      sound: ENTITY_PLAYER_LEVELUP
    gold:
      name: "&6金锭"
      material: GOLD_INGOT
      amount: 2
      weight: 17
      color: "#FCEB4B"
      label: "GOLD"
      sound: BLOCK_NOTE_BLOCK_PLING
    firework:
      name: "&e烟花礼包"
      material: FIREWORK_ROCKET
      amount: 3
      weight: 10
      color: "#F5B043"
      label: "FIREWORK"
      sound: ENTITY_FIREWORK_ROCKET_LAUNCH
      message: "&e你刮到了烟花礼包！"
      # 事件效果示例：以控制台身份执行，%player% 会换成玩家名
      commands:
        - "say %player% 刮到了烟花礼包"

