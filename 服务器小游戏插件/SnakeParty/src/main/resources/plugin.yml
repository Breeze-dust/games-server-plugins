name: SnakeParty
version: '1.2.1'
main: com.snakeparty.SnakePartyPlugin
api-version: '1.21'
description: 蛇行派对：沿视线自动前进，撞到玻璃板或掉出场地即淘汰
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

minigame-game: true
minigame:
  name: 蛇行派对
  icon: GLASS_PANE
  color: 'a'

commands:
  snake:
    description: 蛇行派对小游戏
    usage: /snake help
    aliases: [snakeparty]

permissions:
  snake.use:
    default: true
  snake.admin:
    default: op
