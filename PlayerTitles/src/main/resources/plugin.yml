name: PlayerTitles
version: '1.3.3'
main: com.example.playertitles.PlayerTitlesPlugin
api-version: '26.2'
description: 玩家头衔系统（头顶/聊天显示、头衔菜单、管理员编辑）
author: example
commands:
  titles:
    description: 打开头衔菜单或管理头衔
    usage: /titles help
    aliases: [titlemenu, tmenu]
permissions:
  playertitles.use:
    description: 允许打开头衔菜单并选择头衔
    default: true
  playertitles.admin:
    description: 允许管理头衔
    default: op
