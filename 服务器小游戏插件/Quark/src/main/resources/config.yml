# ============================================================
# 粒子枪战（Quark）配置文件
# 修改后：在非对局状态执行 /quark reload，或重启服务器
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
# 最少开局人数（至少 2）
min-players: 2
# 最多人数
max-players: 16

# ---------- 对局 ----------
# 一局时长（秒），到时按击杀数排名
game-seconds: 90
# 复活后的无敌时间（tick，20 tick = 1 秒）；开局也套用这个时间
respawn-invulnerable-ticks: 30

# ---------- 枪 ----------
gun:
  # 枪使用的物品（默认铁锄）
  material: IRON_HOE
  name: '&b&l粒子手枪 &7(右键射击)'
  lore:
  - '&7右键发射一束直线粒子弹道'
  - '&7命中玩家直接击杀，墙体可以挡住子弹'
  # 每次射击后的冷却（秒，可写小数）
  cooldown-seconds: 3.0
  # 最大射程（格）
  range: 64.0
  # 判定半径（格）：以玩家碰撞箱为基础向外扩展多少
  hit-radius: 0.45
  # 弹道粒子每隔多少格生成一个（越小越密）
  particle-step: 0.25
  # 弹道粒子类型（Bukkit Particle 名称，默认 END_ROD）
  particle: END_ROD

# ---------- 场地 ----------
# 用指令设置，不要手写坐标：
#   /quark setpos1 | /quark setpos2 | /quark setlobby | /quark addspawn | /quark save
arena:
  # 区域两个对角（只取 X/Z，Y 不限制；世界取设置时的玩家所在世界）
  pos1: ''
  pos2: ''
  # 等待点（等待室）
  lobby: ''
  # 复活/开局出生点，可多个；用 /quark addspawn 添加
  spawns: []
  # 低于这个 Y 视为掉出场地，自动传回出生点
  void-y: -64
