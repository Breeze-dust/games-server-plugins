name: ArcheryMaster
version: '1.0.3'
main: com.archery.ArcheryPlugin
api-version: '1.21'
description: 箭术大师：主城随时可玩的限时射箭小游戏
depend: [MiniGameLib]
softdepend: [HubCore]
commands:
  archery:
    description: 箭术大师射箭小游戏
    usage: /archery help
    aliases: [am, 箭术大师]
    permission: archery.use
permissions:
  archery.use:
    description: 参与箭术大师
    default: true
  archery.admin:
    description: 管理箭术大师（区域、站位、记录、排行榜）
    default: op
