name: LobbyToys
version: '1.3.0'
main: com.lobbytoys.LobbyToysPlugin
api-version: '1.21'
description: 主城小玩具：分身、缩小药水，以及命令调用的刮刮乐

depend: [MiniGameLib]

commands:
  lobbytoys:
    description: 主城小玩具
    usage: /lobbytoys help
    aliases: [toys, toy]

permissions:
  lobbytoys.use:
    description: 允许使用主城小玩具
    default: true
  lobbytoys.admin:
    description: 允许发放/管理主城小玩具
    default: op
  lobbytoys.scratch:
    description: 允许用 /lobbytoys scratch 生成刮刮乐（暂不进入小玩具菜单）
    default: op
