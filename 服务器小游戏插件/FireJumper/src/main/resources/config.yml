    name: '&a&l返回大厅 &7(右键)'
    lore:
      - '&7点击返回大厅'
    slot: 8
  start:
    material: PAPER
    name: '&a&l开始游戏 &7(右键)'
    lore:
      - '&7点击立刻开始本局'
    slot: 4
