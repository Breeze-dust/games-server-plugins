# 单局时长（秒）。0 = 不限时；时间到按当前得分结算
game-seconds: 180
# 等待人数
min-players: 2
# 最多 16 人（插件只有 16 种染色玻璃颜色）
max-players: 16
# 落水/跳偏后传回高台的延迟（tick）
respawn-delay-ticks: 8
# 结束结算后停留多久再送回主城（tick）
end-delay-ticks: 60

# 场地（OP 用 /jump setwater 1|2、/jump addstart、/jump setlobby 设置，再 /jump save）
arena:
  world: world
  # 水域两个对角（只支持一格高，两角的 Y 必须相同）
  water-pos1: ''
  water-pos2: ''
  # 等待点（不设则使用第一个出发点）
  lobby: ''
  # 高台出发点列表，每个玩家按加入顺序分配
  start-points: []
