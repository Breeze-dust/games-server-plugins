name: ArrowRain
version: '1.0.1'
main: com.arrowrain.ArrowRainPlugin
api-version: '1.21'
description: 万箭齐发：躲在随机半砖掩体下躲避箭雨，第 N 回合起开放 PvP

depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

minigame-game: true
minigame:
  name: 万箭齐发
  icon: ARROW
  color: 'e'

commands:
  arrowrain:
    description: 万箭齐发小游戏
    usage: /arrowrain help
    aliases: [ar, arrows]

permissions:
  arrowrain.play:
    description: 允许加入万箭齐发
    default: true
  arrowrain.admin:
    description: 允许配置和管理万箭齐发
    default: op
