# ========== 密室杀手配置 ==========
# 场地列表（OP 可用 /mm create + /mm setup 快速配置）
arenas: {}

# 游戏规则
# 至少几人才能开局（等待倒计时自动开始与 OP /mm start 都按这个）
min-players: 3
max-players: 16
# 每局杀手数量（默认 1，其余玩家全部为无辜者；杀手不隐身，手持铁剑可见）
murderer-count: 1
# 每局侦探数量（侦探属于无辜者阵营，胜负按无辜者算）
detective-count: 1
# 每局猎人数量（猎人属于无辜者阵营，与侦探并存；开局发 1 把无限箭的弓）
hunter-count: 1
# 职业累计概率（杀手/侦探/猎人各自独立计算）：
# 每局没当上该职业 -> 该职业权重 +step；当上 -> 清零；权重封顶 max。
# 等待室经验条上方显示的是按当前人数、职业数量、禁连庄模拟出的实际中选率。
role-chance:
  murderer:
    base: 1.0
    step: 2.0
    max: 50.0
  detective:
    base: 1.0
    step: 2.0
    max: 50.0
  hunter:
    base: 1.0
    step: 2.0
    max: 50.0
# 侦探每隔多少秒自动获得一颗真理之石（右键打开菜单选玩家探测，也可左键直接点人）
detective-stone-seconds: 30
# 一局时长（秒），时间到则无辜者获胜（杀手没能杀光所有人）
game-seconds: 180
# 最后多少秒开始给杀手画粒子线，指向所有存活好人（只发给杀手本人；0 = 关闭）
endgame-reveal:
  seconds: 60
  # 粒子类型（Bukkit Particle 名称，建议用不需要额外数据的，如 END_ROD / GLOW）
  particle: END_ROD
  # 粒子线每隔多少格放一个粒子（越小越密，越费性能）
  step: 1.5
# 每名玩家死亡时掉落的金锭数量
gold-per-death: 1
# 补货间隔（秒）：每隔这么久，按顺序给接下来还没金锭的金块补货
gold-spawn-interval: 10
# 每次补货补几个金块（每个金块上只会有 1 个金锭；想多/少就改这个）
gold-spawn-amount: 1

# 金锭商店（开局所有玩家获得商店道具，右键打开；商店道具不可丢弃）
# 石剑：近战命中杀手一击必杀；误伤无辜者两人同归于尽
sword-cost: 8
# 弩：远程弩矢命中杀手一击必杀；误伤无辜者两人同归于尽
# 旧配置里的 bow-cost 仍作兜底读取；新服直接用 crossbow-cost
crossbow-cost: 8
# 每支箭的价格（2 金锭换 1 支箭）
arrow-cost: 2
# 真理之石价格（10 金锭）：右键打开菜单选玩家探测身份，杀手→红石，无辜者→钻石
truth-stone-cost: 10
# 死亡名单价格（1 金锭）：右键得知本局已经死了哪些人（死亡一律不播报、也不提示当事人）
death-note-cost: 1
# 断头饭价格（默认 1 金锭 5 块牛排）：纯食物，无特殊效果，凶手与无辜者都能买
steak-cost: 1
# 断头饭一次给几块牛排
steak-amount: 5

# 加入告示牌（OP 可用 /mm joinsign <场名> 放置）
join-signs: {}
