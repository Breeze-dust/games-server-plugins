name: GuessTheBuild
version: '2.8.3'
main: com.buildbattle.gtb.GuessBuildPlugin
api-version: '26.2'
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]
author: BuildBattle
description: 建筑猜猜乐 - Hypixel Guess the Build 风格中文猜词小游戏

# ===== 给主城插件（HubCore）的标记：自动登记为 tab 分区 / 菜单入口 =====
# name 与 HubCore config.yml games 段的名字一致（alias: 猜猜乐 指向插件 API 传入名）
minigame-game: true
minigame:
  name: 建筑猜猜乐      # tab 分区显示名
  icon: GRASS_BLOCK    # 中央菜单图标（物品英文名）
  color: '6'           # tab 分区标题颜色，0-9 a-f

commands:
  gtb:
    description: 建筑猜猜乐主命令
    usage: /gtb help
    aliases: [gb]
  leave:
    description: 退出建筑猜猜乐（等待/游戏中都可以）
    usage: /leave
    aliases: [quit, gtbleave]

permissions:
  gtb.play:
    description: 允许加入/开始游戏
    default: true
  gtb.admin:
    description: 允许场地设置、词库管理、强制结束、重载配置
    default: op
