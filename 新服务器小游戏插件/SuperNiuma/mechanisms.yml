# ========== 超级牛马 机关列表 ==========
# 每个机关都可以在这里改：是否启用、权重、图标、说明、参数。
# 权重越大越容易被抽到；weight: 0 等于不出现。
# 尺寸规则：
#   平台 / 尖刺的 size 是 [x, z] 平面尺寸；
#   发射器的 size 是 [宽度, 高度]，深度固定 1 格，旋转后发射口始终朝外，不会被同机关的方块挡住。
# rotation 取值：
#   four-way        左键水平 90°，右键竖直 90°
#   six-way         左键水平 90°，右键竖直 90°（发射器朝向）
#   horizontal-flip 左键水平 90°，右键竖直 180°（尖刺）
#   vertical        只能竖直 180°

mechanisms:
  spike:
    enabled: true
    weight: 20
    icon: POINTED_DRIPSTONE
    name: '&c尖刺'
    lore:
      - '&7由滴水石构成'
      - '&7碰到尖刺的玩家本回合失败'
      - '&7左键水平旋转，右键上下翻转'
    rotation: horizontal-flip
    variants:
      single:
        name: '1x1'
        weight: 20
        size: [1, 1]
      row:
        name: '1x3'
        weight: 30
        size: [1, 3]
      medium:
        name: '2x3'
        weight: 30
        size: [2, 3]
      large:
        name: '3x3'
        weight: 20
        size: [3, 3]

  platform:
    enabled: true
    weight: 20
    icon: WHITE_WOOL
    name: '&f平台'
    lore:
      - '&7可以站立的羊毛平台'
      - '&7左键旋转，右键翻转'
    rotation: four-way
    variants:
      small:
        name: '&f小平台 1x2'
        weight: 50
        size: [1, 2]
      medium:
        name: '&f中平台 2x3'
        weight: 30
        size: [2, 3]
      large:
        name: '&f大平台 3x3'
        weight: 20
        size: [3, 3]

  dispenser:
    enabled: true
    weight: 15
    icon: DISPENSER
    name: '&7发射器'
    lore:
      - '&7按固定间隔发射箭矢'
      - '&7碰到箭的玩家本回合失败'
      - '&7多格发射器会一起发射'
    rotation: six-way
    interval-ticks: 40
    arrow-range: 20
    arrow-speed: 1.6
    variants:
      single:
        name: '1x1'
        weight: 30
        size: [1, 1]
      tall:
        name: '1x3'
        weight: 40
        size: [1, 3]
      wall:
        name: '2x3'
        weight: 30
        size: [2, 3]

  coin:
    enabled: true
    weight: 25
    icon: GOLD_BLOCK
    name: '&6金币'
    lore:
      - '&7没有碰撞箱的缩小金块'
      - '&7碰到后消失，回合结算加分'
      - '&7场上同时存在数量有上限'
    points: 0.5
    scale: 0.5
    max-on-field: 3         # 整局同时存在的金币上限；炸掉一个后才会再出现在选择里

  bomb:
    enabled: true
    weight: 10
    icon: TNT
    name: '&c炸弹'
    lore:
      - '&7炸掉范围内的所有机关'
      - '&7不会破坏地图原本的方块'
    radius: 1               # 1 = 3x3x3
    low-clear-rate: 0.05    # 本回合通关率低于该值时触发保底
    low-clear-weight: 40    # 触发保底时炸弹使用的权重
    low-clear-min-count: 1  # 保底至少出现几个炸弹
