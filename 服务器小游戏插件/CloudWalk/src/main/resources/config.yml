# ========== 云中漫步（主城跑酷）配置 ==========
# 区域和起点用游戏内命令设置：/cloudwalk pos1 / pos2 / setstart / setlobby
# 注意：插件关服时会回写本文件的 region/start/lobby 段；
# 手改配置请在停服后改，或改完执行 /cloudwalk reload。

# 跑酷生成区域：两个对角方块坐标（/cloudwalk pos1 / pos2）
region:
  world: ''
  x1: 0
  y1: 0
  z1: 0
  x2: 0
  y2: 0
  z2: 0

# 基准起点：玩家站的那一块方块（/cloudwalk setstart，取脚下那一块）
start:
  world: ''
  x: 0
  y: 0
  z: 0

# 回大厅位置（没装 HubCore 或主城没有配置时使用；/cloudwalk setlobby）
lobby:
  world: ''
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# 多人通道：每人一份区域副本，横向并排、逐层抬高
lane:
  axis: x        # x 或 z：通道并排的方向
  gap: 3         # 相邻通道之间的空格
  height-step: 2 # 每多一名玩家，起点抬高多少格
  max: 12        # 最多同时多少人跑

# 路径生成
path:
  distances: [3, 4]        # 每跳前进的水平格数
  heights: [-2, -1, 0, 1]  # 每跳的高度差（-2 = 下降两格）
  queue-length: 3          # 前方预生成几个方块
  allow4-jump-up: false    # 原版跳不上「水平4格+上升1格」，默认关闭

  # 方块池：进跑酷后物品栏第 1 格的「选择跑酷方块」道具可逐项开关
  # 默认 16 色羊毛 + 16 色带釉陶瓦；可以自行增删（写 Bukkit 材质名）
  blocks:
    - WHITE_WOOL
    - ORANGE_WOOL
    - MAGENTA_WOOL
    - LIGHT_BLUE_WOOL
    - YELLOW_WOOL
    - LIME_WOOL
    - PINK_WOOL
    - GRAY_WOOL
    - LIGHT_GRAY_WOOL
    - CYAN_WOOL
    - PURPLE_WOOL
    - BLUE_WOOL
    - BROWN_WOOL
    - GREEN_WOOL
    - RED_WOOL
    - BLACK_WOOL
    - WHITE_GLAZED_TERRACOTTA
    - ORANGE_GLAZED_TERRACOTTA
    - MAGENTA_GLAZED_TERRACOTTA
    - LIGHT_BLUE_GLAZED_TERRACOTTA
    - YELLOW_GLAZED_TERRACOTTA
    - LIME_GLAZED_TERRACOTTA
    - PINK_GLAZED_TERRACOTTA
    - GRAY_GLAZED_TERRACOTTA
    - LIGHT_GRAY_GLAZED_TERRACOTTA
    - CYAN_GLAZED_TERRACOTTA
    - PURPLE_GLAZED_TERRACOTTA
    - BLUE_GLAZED_TERRACOTTA
    - BROWN_GLAZED_TERRACOTTA
    - GREEN_GLAZED_TERRACOTTA
    - RED_GLAZED_TERRACOTTA
    - BLACK_GLAZED_TERRACOTTA

# 运行（站在方块上可以无限挂机，没有挂机超时）
run:
  sound: true
  particle: true        # 落到新方块时的粒子

top-size: 10

# 浮空文字排行榜（/cloudwalk top place 在当前位置放置，top remove 移除）
# 固定朝向，不会跟着玩家转；每 5 秒刷新一次
leaderboards: []
