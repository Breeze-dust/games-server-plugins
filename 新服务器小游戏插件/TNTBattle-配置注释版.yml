# ============================================================
# TNT 对战（TNTBattle）配置文件
# 修改后：在非对局状态执行 /tntbattle reload，或重启服务器
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
# 最少开局人数（至少 2，双方各至少 1 人）
min-players: 2
# 最多人数，可自行调大（上限 100）
max-players: 16

# ---------- 等待室道具 ----------
# 等待阶段发给玩家的道具，材质/名字/描述/槽位都能改
# slot：0-8 是快捷栏，8 = 最后一格
wait-items:
  # 所有等待玩家都会拿到：右键返回主城
  return:
    material: CLOCK
    name: '&a&l回主城 &7(右键)'
    lore:
      - '&7点击返回主城'
    slot: 8
  # 仅管理员会拿到：右键立刻开始
  start:
    material: PAPER
    name: '&a&l开始游戏 &7(右键)'
    lore:
      - '&7点击立刻开始本局'
    slot: 4

# ---------- 内部配置版本 ----------
# 用于旧配置的一次性迁移，请不要手改
config-version: 2

# ---------- 普通 TNT ----------
# TNT 补给冷却（秒）：冷却结束自动获得 TNT 弹药
tnt-cooldown-seconds: 5
# 背包里最多持有多少 TNT 弹药（到达上限后不再补充）
tnt-max-ammo: 10
# 引信时间（tick，20 tick = 1 秒）
tnt-fuse-ticks: 40
# 发射初速度（1.5 ≈ 150%，数字越大飞得越远/越快）
tnt-velocity: 1.5
# 爆炸威力（原版 TNT 默认 4.0，越大破坏范围越大；掉落物固定为 0）
tnt-yield: 4.0
# TNT 爆炸对玩家造成的伤害（1 = 半颗心；0 = 不掉血）
tnt-damage: 10.0
# 爆炸伤害半径（格）：越靠近爆心伤害越高，边缘为 15%
tnt-damage-radius: 6.0
# 摔落伤害倍率（0 = 无摔落伤害，1 = 原版）
fall-damage-multiplier: 0.5

# ---------- TNT 数量随时间递增 ----------
# 每 interval-seconds 秒提升一档，每档多给 amount-per-step 个，最多 max-amount 个
# enabled: false 或 interval-seconds: 0 = 关闭（始终每次 1 个）
tnt-ramp:
  enabled: true
  interval-seconds: 60
  amount-per-step: 1
  max-amount: 5

# ---------- 特殊道具池 ----------
# 每 cooldown-seconds 秒随机获得一个特殊道具（与普通 TNT 补给互相独立）
# pool 按顺序列出所有特殊道具；weight 越大越容易随机到
# 想加同类型的变体，直接往下复制一个条目改属性即可
#
# type 支持的四种行为：
#   flame     烈焰弹：碰到方块/落地才爆炸
#   blackhole 黑洞炸弹：到点后把附近玩家吸向中心，不爆炸
#   decoy     诱饵炸弹：到点后锁定附近玩家视角，不爆炸，到时消失
#   highex    高爆炸弹：爆炸范围/伤害更大
#
# 通用字段：
#   type / weight / material / name / lore / velocity
#   fuse-ticks：发射后多少 tick 触发（flame 不用，highex 是引信，blackhole/decoy 是开始效果前的延迟）
#   yield：爆炸威力（flame / highex）
#   damage / damage-radius：爆炸伤害和伤害半径（flame / highex）
#   pull-radius / pull-strength / pull-seconds：吸附半径/每 tick 拉力/持续秒数（blackhole）
#   lock-radius / lock-seconds：锁定视角的半径/持续秒数（decoy）
special-items:
  # 特殊道具的独立获得冷却（秒）；0 = 不再自动发放特殊道具
  cooldown-seconds: 30
  pool:
    # 烈焰弹：发射后飞行，碰到方块或落地才爆炸
    - type: flame
      weight: 25
      material: BLAZE_POWDER
      name: '&6&l烈焰弹 &7(右键发射)'
      lore:
        - '&7碰到方块才会爆炸'
      velocity: 1.2
      yield: 4.0
      damage: 10.0
      damage-radius: 6.0

    # 黑洞炸弹：发射后按 fuse-ticks 延迟，然后吸附附近玩家
    - type: blackhole
      weight: 20
      material: NETHER_STAR
      name: '&5&l黑洞炸弹 &7(右键发射)'
      lore:
        - '&7落地后把附近玩家吸向中心'
      velocity: 1.0
      fuse-ticks: 20
      pull-radius: 8.0
      pull-strength: 0.35
      pull-seconds: 4

    # 诱饵炸弹：发射后按 fuse-ticks 延迟，然后锁定附近玩家视角
    - type: decoy
      weight: 20
      material: TARGET
      name: '&e&l诱饵炸弹 &7(右键发射)'
      lore:
        - '&7让附近玩家的视线锁定它'
      velocity: 1.2
      fuse-ticks: 20
      lock-radius: 12.0
      lock-seconds: 5

    # 高爆炸弹：普通引信，更大的爆炸范围和伤害
    - type: highex
      weight: 20
      material: TNT
      name: '&c&l高爆炸弹 &7(右键发射)'
      lore:
        - '&7爆炸范围更大'
      velocity: 1.4
      fuse-ticks: 40
      yield: 8.0
      damage: 16.0
      damage-radius: 10.0

# ---------- 牛排 ----------
# 开局放在快捷栏指定格；默认不会自动补充
steak:
  enabled: true
  # 每次给多少个（最大 64）
  amount: 64
  # 放在快捷栏第几格（0-8；8 = 最后一格）
  slot: 8
  # 是否自动补充（false = 吃完就没有）
  auto-refill: false
  # 自动补充间隔（秒）
  refill-cooldown-seconds: 30

# ---------- 羊毛 ----------
# 每隔多少秒获得一次羊毛
wool-cooldown-seconds: 1
# 每次获得多少个
wool-amount: 1

# ---------- 淘汰 / 建造限制 ----------
# 掉到这个 Y 以下直接淘汰
void-y: -64
# 建筑高度上限（绝对 Y）：只能在这层及以下放羊毛；-1 = 不限制
build-height-limit: -1

# ---------- 场地 ----------
# 用指令设置，不要手写坐标；设置完成后 /tntbattle save
arena:
  world: world
  # 区域两个对角（只取 X/Z，Y 自动覆盖整个世界高度）
  # TNT 只会破坏这个范围内的方块，范围外不会影响其他小游戏场地
  pos1: ''
  pos2: ''
  # 等待点
  lobby: ''
  # 每队出生点，可多个；用 /tntbattle addspawn red|blue 添加
  red-spawns: []
  blue-spawns: []
