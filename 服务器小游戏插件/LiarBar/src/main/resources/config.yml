# ========== 骗子酒馆配置 ==========
# 房间区域：OP 站到房间两个对角执行 /liarbar pos1、/liarbar pos2。
# 玩家走进这个区域就自动算进入酒馆（没设区域时退回等待点周围 48 格）。
room:
  world: ''
  spawn: {}
  pos1: {}
  pos2: {}

# 桌子（场次）：一张桌子登记 4 把椅子，椅子必须是一段楼梯方块。
# OP 站在楼梯上执行 /liarbar addchair <桌名>，逐把登记；登记满 4 把即可开局。
# 示例（不用手写，命令会自动生成）：
# tables:
#   一号桌:
#     seats:
#     - {world: world, x: 10.0, y: 65.0, z: 10.0}
tables: {}

settings:
  # 每桌玩家数（同时也是每桌需要的椅子数）
  players-per-table: 4
  # 不够坐满时，至少几人全部点「准备」才能开局（支持两人局 / 三人局）
  min-players: 2
  # 四人坐满后自动开局的倒计时（秒）
  start-countdown-seconds: 3
  # 每人每回合手牌数（牌库固定 20 张：钻石/绿宝石/金锭各 6 张 + 万能牌 2 张）
  hand-size: 5
  # 一次最多声称几张牌
  max-play-cards: 3
  # 每人的思考时间（秒），超时自动打出一张牌
  turn-seconds: 30
  # 质疑结算后到下一回合的间隔（秒）
  round-delay-seconds: 4
  # 本局结束后，全员从座椅起身并留在房间里等待下一局（秒）
  end-delay-seconds: 5
  # 左轮弹巢数：扣一次扳机弹巢转一格，转到子弹就中弹
  chambers: 6
  # 揭幕时每张牌之间的间隔（tick，20 tick = 1 秒）
  reveal-delay-ticks: 14
  # 拿到左轮后多少秒不开枪就自动扣扳机
  fire-wait-seconds: 15
  # 被岩浆浇头后焚烧多少秒（血条清零前就转观战）
  burn-seconds: 6
  # 空枪放水持续多少秒
  water-seconds: 3
  # 水/岩浆每次往下流一格间隔多少 tick（20 tick = 1 秒；越大流得越慢）
  flow-ticks-per-block: 6
