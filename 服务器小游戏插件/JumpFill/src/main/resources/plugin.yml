name: JumpFill
version: '1.0.13'
main: com.jumpfill.JumpFillPlugin
api-version: '26.2'
description: 跳水填格：从高台跳进水池，落点变成玩家颜色的玻璃
author: example

depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

commands:
  jump:
    description: 跳水填格
    usage: /jump help
    aliases: [jf]

permissions:
  jumpfill.play:
    description: 允许加入跳水填格
    default: true
  jumpfill.admin:
    description: 允许配置和管理跳水填格
    default: op

# ===== 给 HubCore 的小游戏标记 =====
minigame-game: true
minigame:
  name: 跳水填格
  icon: WATER_BUCKET
  color: 'b'
