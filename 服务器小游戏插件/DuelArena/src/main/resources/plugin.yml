name: DuelArena
version: '1.0.2'
main: com.duel.arena.DuelPlugin
api-version: '1.21'
description: 单挑 PvP 插件：多决斗场、范围限制、物品配置窗口、战绩告示牌
depend: [MiniGameLib, HubCore]
softdepend: [GameWorlds]

# ===== 给主城插件（HubCore）的标记：自动登记为 tab 分区 / 菜单入口 =====
# name 必须与 HubCore config.yml games 段的 name 一致（display name）。
# 有这个段，GameRegistry 才记得住"插件名 DuelArena -> 显示名"，
# 公屏的"加入了游戏"播报（HubAPI.announceJoin(plugin.getName(), ...)）才不会显示成 [DuelArena]。
minigame-game: true
minigame:
  name: 单挑 PvP
  icon: DIAMOND_SWORD
  color: c

commands:
  duel:
    description: 单挑 PvP 场管理与对战
    usage: /duel help
    aliases: [pvp, 1v1]
    permission: duel.use
permissions:
  duel.use:
    description: 使用 /duel 加入对战
    default: true
  duel.admin:
    description: 管理决斗场
    default: op
