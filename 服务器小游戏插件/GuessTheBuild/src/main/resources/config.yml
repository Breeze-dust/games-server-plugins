# ================= 建筑猜猜乐 配置文件 =================
# 玩法：Hypixel Guess the Build 风格猜词小游戏
# 每轮 1 人建造、其余玩家旁观猜词，轮流当建造者

game:
  min-players: 3          # 最少几人可以开始
  max-players: 16          # 最多几人（超过无法加入）
  rounds: 0               # 总轮数，0 = 每人各当一次建造者
  build-time-seconds: 150 # 每轮建造/猜词时间（秒）
  evaluate-seconds: 10           # 评价阶段时长（秒）：建造时间到后建造者切生存、观众切创造，可扔鸡蛋/雪球/烟花，并在聊天框输入 0~10 打分（每人一次）
  selfmade-blacklist: []      # 自创词玩家黑名单（UUID）：自创词平均分低于 score-blacklist-below 后自动加入，可用 /gtb blacklist 管理
  selfmade-word-blacklist: [] # 自创词词黑名单（词）：自创词平均分低于 score-blacklist-below 后自动加入，可用 /gtb blacklist word 管理
  score-blacklist-below: 4    # 自创词平均分低于此值（不含）→ 该词进词黑名单 + 建造者进玩家黑名单
  score-library-above: 6      # 自创词平均分高于此值（不含）→ 该词加入题库（分类“自创”）
  theme-select-seconds: 15 # 建造者开局前从 5 个题目中选择的时间（秒），0 = 关闭
  max-word-length: 5      # 题目最大字数
  max-build-height: 40    # 建造高度上限（超过会被拉回）；换人时清空到该高度
  hint-time-seconds: 60   # 多少秒后揭示答案第一个字，设为 -1 关闭提示
  round-delay-seconds: 5  # 轮与轮之间的间隔（秒）
  guess-order-scores: [20, 15, 10, 5] # 按猜中顺序给分：第1/2/3/其余
  early-bonus: 5          # 提示出现前猜对的额外加分
  guess-cooldown-ms: 1500 # 玩家两次猜词的最小间隔（毫秒，防刷屏）
  build-margin: 5         # 建造者可超出场地边缘多少格（超过会传送回出生点）
  floor-npc: true         # 开服是否自动在场地西南角生成"地板商店"村民；主城不会再生成（场地未设置时直接跳过）

# ===== 场地管理（支持多个场地，仅管理员） =====
# /gtb arena add <名称>     添加一个新场地并进入选区模式（选两个角点后 /gtb setup save 保存）
# /gtb arena edit <名称>    重新编辑指定场地（选区后 /gtb setup save 覆盖保存）
# /gtb arena select <名称>  切换游戏使用的生效场地
# /gtb arena remove <名称>  删除指定场地（配置与快照）
# /gtb arena list           查看全部场地
# 场地数据由命令自动写入，无需手改；每个场地快照文件为 plugins/GuessTheBuild/arena-<名称>.snap
arenas: {}
active-arena: ''            # 游戏当前使用的生效场地名（由 /gtb arena select 设置）

# 题目词库请改同目录下的 words.yml（/gtb word add|remove 也会写进那里）
