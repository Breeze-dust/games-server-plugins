# ========== HubCore 大厅配置 ==========
# 大厅位置（OP 可用 /hub set 站在位置上更新）
lobby:
  world: world
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# 进大厅后给的菜单道具（右键打开游戏菜单）
menu-item: COMPASS

# 大厅物品栏锁定（true=禁止在大厅捡/丢/移动物品，OP 可用 /hub lock 切换）
lock-inventory: true

# 菜单标题（旧字段：menu.title 存在时以 menu.title 为准，OP 用 /hub menu title 改）
menu-title: 游戏大厅

# ========== 菜单布局（OP 用 /hub menu edit 可视化编辑，改完立即写回这里）==========
# rows:   菜单行数 1-6
# title:  菜单标题（支持 & 颜色代码）
# items:  槽位 -> 物品
#   <槽位>:
#     material: 材质名（如 DIAMOND_SWORD）
#     name:     显示名（可省略；省略时用自动生成的提示）
#     lore:     鼠标悬停提示（每行一条，支持 & 颜色代码）
#     action:   点击动作，五种写法（命令里用空格分隔；带冒号的写法也认，如 cmd:gtb join）：
#       game <游戏名>         只有 1 个场地就直接进，多个场地进该游戏的场地子菜单
#       open <游戏名>         总是打开该游戏的场地子菜单
#       arena <游戏名> <场地>  直接加入指定场地
#       cmd <命令>            以玩家身份执行任意命令（多词命令靠空格分隔，如 cmd gtb join）
#       none                 纯装饰，点了没反应
# sub:    每个游戏的场地子菜单（游戏有多个场地时点图标进入；场地羊毛会自动生成）
#   <游戏名>:
#     rows: 3
#     title: '&e<游戏名> 场地'
#     items:
#       <场地名或槽位>:
#         material: 材质名（省略=按状态给羊毛：绿=没人 / 黄=等待中 / 红=游戏中）
#         name:     可用 {arena} {players} {extra} {state} 占位符
#         lore:     同上，支持占位符
# arena-desc: 场地介绍（OP 用 /hub arena desc <游戏> <场地> <介绍…> 写，多行用 | 分隔）
#   显示在选场地菜单里对应羊毛的 lore 里（鼠标悬停可见）
menu:
  rows: 6
  title: '&e游戏大厅'
  items: {}

# 菜单道具（打开菜单的指南针）放物品栏第几格（0-8，默认 4 = 正中间）
# 默认生成的菜单图标会环绕中间这格排布；如果 OP 自己把菜单物品摆到了这一格，
# 指南针会就近顺延到空槽，不会顶掉菜单入口
menu-item-slot: 4

# tab 列表设置
tab:
  # 是否显示没有人在玩的游戏分区
  # true  = 所有已登记游戏始终显示（含人数 0），游戏多时会把玩家列表挤出屏幕
  # false = 只显示有人的分区（大厅玩家名不会被挤掉；完整游戏列表用主城菜单查看）
  show-empty-games: false

# 菜单里的游戏入口（同时登记到 tab 分区）
# icon:   默认图标（menu.items 空时首次生成的图标；OP 改过菜单后以 menu 段为准）
# name:   显示名（tab 分区名 / 动作里的游戏名）
# alias:  游戏插件调用 HubAPI.setGame 时实际传入的名字（可选，默认同 name；不一致时 tab 会分成两个区）
# color:  tab 分区标题颜色（可选，0-9 a-f，默认 b 青色）
# command: game: 动作在没有任何场地信息时的兜底命令（如 gtb join）
# join-prefix: 加入具体场地的命令前缀（如 duel join），菜单会自动拼场地名
#
# 菜单内容现在完全由上面 menu 段决定（OP 用 /hub menu edit 摆）；
# 场地状态仍由各游戏插件通过 HubAPI.setArena 实时上报，用于子菜单的绿/黄/红羊毛与人数。
games:
  - icon: GRASS_BLOCK
    name: 建筑猜猜乐
    alias: 猜猜乐
    color: '6'
    command: gtb join
    join-prefix: gtb join
  - icon: DIAMOND_SWORD
    name: 单挑 PvP
    alias: 决斗
    color: 'c'
    command: duel join
    join-prefix: duel join
  - icon: POTATO
    name: 烫手山芋
    alias: 烫手山芋
    color: 'e'
    command: hp join
    join-prefix: hp join
  - icon: SNOWBALL
    name: 雪塔大作战
    alias: 雪塔大作战
    color: 'b'
    command: tr join
    join-prefix: tr join
  - icon: IRON_SWORD
    name: 密室杀手
    alias: 密室杀手
    color: '8'
    command: mm join
    join-prefix: mm join
  - icon: MAGENTA_CONCRETE
    name: 色盲派对
    alias: 色盲派对
    color: 'd'
    command: cp join
    join-prefix: cp join
  - icon: LADDER
    name: 你建我跑
    alias: 你建我跑
    color: '3'
    command: br join
    join-prefix: br join
  - icon: CRYING_OBSIDIAN
    name: 幸运之柱
    alias: 幸运之柱
    color: '5'
    command: lp join
    join-prefix: lp join
