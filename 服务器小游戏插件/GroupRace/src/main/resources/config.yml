# ============================================================
# 群友竞速赛（GroupRace）配置文件
# 修改后：在非对局状态执行 /race reload，或重启服务器
# 注意：YAML 的冒号后面必须有空格，缩进必须用空格（不能用 Tab）
# ============================================================

# ---------- 人数 ----------
min-players: 2
max-players: 16

# ---------- 对局 ----------
# 一局时长（秒）
game-seconds: 300
# 超过一半玩家到达终点后，剩余时间缩短到多少秒
finish-short-seconds: 20

# ---------- 参赛玩家外观 ----------
# true = 所有参赛玩家隐身，但保留发光轮廓（其他人能隔墙看到轮廓；飞猪仍然可见）
invisible-glowing: true

# ---------- 等待室道具 ----------
# 返回大厅：默认放在快捷栏最后一格（槽位 8）
# 开始游戏：仅管理员拿到，默认放在第 5 格（槽位 4）
wait-items:
  return:
    material: RED_BED
    name: '&a&l返回大厅 &7(右键)'
    lore:
    - '&7点击返回大厅'
    slot: 8
  start:
    material: PAPER
    name: '&a&l开始游戏 &7(右键)'
    lore:
    - '&7点击立刻开始本局'
    slot: 4

# ---------- 飞猪 ----------
pig:
  # 自动前进速度（格/tick，约 0.5-0.8）
  speed: 0.55
  # 惯性：0 = 立即转向，0.9 = 很滑；越大越难急转
  inertia: 0.85
  # 按住跳跃键上升速度（格/tick）
  ascend-speed: 0.35
  # 按住下蹲键下降速度（格/tick）
  descend-speed: 0.35
  # 多名玩家在起点横向散开的间距（格）
  start-spread: 2.0

# ---------- 等待室骑猪 ----------
# 准备阶段玩家可以骑猪，完全手动（WASD + 视角），有重力、不会飞、不自动前进
lobby-pig:
  enabled: true
  # 手动移动速度（格/tick）
  speed: 0.25

# ---------- 圆环 ----------
ring:
  # 圆环半径（格）；方块会围成一圈，中间是穿过用的洞
  radius: 3.0
  # 普通圆环方块材质
  material: SEA_LANTERN
  # 终点圆环方块材质
  finish-material: REDSTONE_BLOCK

# ---------- 场地 ----------
# 用指令设置，不要手写坐标：
#   /race setlobby | /race setstart | /race pos1 | /race pos2
#   /race addring | /race addfinish | /race save
arena:
  # 等待点
  lobby: ''
  # 起跑点（玩家面朝方向就是赛道方向）
  start: ''
  # 出界判断的三维方框两个对角
  pos1: ''
  pos2: ''

# 圆环列表（用 /race addring、/race addfinish 自动写入，不要手写）
rings: []
