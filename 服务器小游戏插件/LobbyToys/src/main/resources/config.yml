# ========== 主城小玩具（LobbyToys）配置 ==========

# 允许使用玩具的世界名（主城）。不在列表里的世界右键道具只提示、不生效。
worlds:
  - world

# 进入上述世界时自动发一个玩具道具
give-on-join: true
# 玩具道具优先放的快捷栏槽位（0-8），被占则自动找空位
item-slot: 8

# 分身自转速度（度/刻，20 刻 = 1 秒；4.0 = 每 4.5 秒转一圈）
spin-degrees-per-tick: 4.0
# 分身上下弹动的幅度（格）与周期（刻）
bob-amplitude: 0.18
bob-period-ticks: 60

# 右键开关的冷却（毫秒）
cooldown-millis: 1500

# 是否对召唤者本人隐藏分身（避免第一人称镜头穿模；其他玩家仍能看到）
hide-from-owner: true
