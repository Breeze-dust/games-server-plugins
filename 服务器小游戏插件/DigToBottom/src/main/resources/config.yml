# ========== 一掘到底（DigToBottom）配置 ==========
# 场地由 OP 用 /dig create、/dig center、/dig build 生成；这里只放全局规则。
arenas: {}

min-players: 1
max-players: 8

# 开局冻结倒计时（秒）：期间不能移动、不能破坏方块，但道具已经发到手上
countdown-seconds: 3

# 每局总时长（秒），从倒计时结束后开始计时
game-seconds: 180

# 已到达底部的人数达到一半时，把剩余时间缩短到多少秒
shorten-seconds: 20

# 诊断日志：在控制台打印场地内的挖掘判定（排查“某些方块挖不动”时用；平时设 false）
# 运行时也可以用 /dig debug 开关；出生点保护（spawn-protection）的提示不受它影响。
debug-break-logs: true

# 柱子的高度（格）与每一层随机挑选的方块池。
# 同一局所有玩家的柱子完全一样；每局重新随机，尽量把池子里的方块都用上。
pillar:
  height: 60
  materials:
    # 斧头加速（各种原木/菌柄）
    wood:
    - OAK_LOG
    - SPRUCE_LOG
    - BIRCH_LOG
    - JUNGLE_LOG
    - ACACIA_LOG
    - DARK_OAK_LOG
    - MANGROVE_LOG
    - CHERRY_LOG
    - BAMBOO_BLOCK
    - CRIMSON_STEM
    - WARPED_STEM
    # 镐子加速（各种石头）
    pickaxe:
    - STONE
    - COBBLESTONE
    - GRANITE
    - POLISHED_GRANITE
    - DIORITE
    - POLISHED_DIORITE
    - ANDESITE
    - POLISHED_ANDESITE
    - TUFF
    - CALCITE
    - DEEPSLATE
    - COBBLED_DEEPSLATE
    - DRIPSTONE_BLOCK
    - BASALT
    - BLACKSTONE
    # 铲子加速（沙子/泥土类）
    shovel:
    - DIRT
    - COARSE_DIRT
    - ROOTED_DIRT
    - GRASS_BLOCK
    - PODZOL
    - MYCELIUM
    - SAND
    - RED_SAND
    - GRAVEL
    - CLAY
    - SOUL_SAND
    - SOUL_SOIL
    - SNOW_BLOCK
    - MUD
